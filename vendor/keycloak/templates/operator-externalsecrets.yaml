{{- if and .Values.operator.enabled (eq (.Values.operator.secretsSource | default "eso") "eso") }}
{{- /*
Secrets del CR Keycloak (Operator) del participante desde OpenBao via ESO (API v1, la
unica que sirve el ESO v2.x de on-prem). El realm `participant` on-prem no lleva
passwords en la plantilla (solo nombres, emails y SMTP), asi que bastan:

  keycloak-admin-secret  username <- <ns>-keycloak-op#admin_username
                         password <- <ns>-keycloak#admin  (la del Bitnami, la misma)
  keycloak-db-secret     username <- <ns>-keycloak-op#db_username
                         password <- <ns>-keycloak-op#db_password
  keycloak-op-config-token token para bajar realm/SPI/theme (si configFiles.tokenRef)
  keycloak-op-smtp       SMTP_PASSWORD (solo externos con smtp.enabled; el core lo
                         saca del Secret notification-smtp)

Las claves de la BD van en <ns>-keycloak-op y NO en <ns>-postgres-passwords: el
openbao-seeder del conector hace `kv put` sobre ese path en cada sync y se las
llevaria (lo mismo que paso con openbao-init en devauth, 10/11). Las siembra
scripts/keycloak/seed-participant-op-secrets-onprem.sh.

Los defaults explicitos (conversionStrategy/decodingStrategy/metadataPolicy/
nullBytePolicy) evitan el OutOfSync perpetuo de Argo con ESO v2.5.
*/ -}}
{{- $op := .Values.operator -}}
{{- $ns := required "operator.secrets.namespacePrefix" $op.secrets.namespacePrefix -}}
{{- $store := required "operator.secretStore" $op.secretStore -}}
{{- $opPath := printf "%s-keycloak-op" $ns -}}
{{- $secrets := list
  (dict "name" "keycloak-admin-secret" "data" (list
      (dict "k" "username" "path" $opPath "prop" "admin_username")
      (dict "k" "password" "path" (printf "%s-keycloak" $ns) "prop" "admin")))
  (dict "name" "keycloak-db-secret" "data" (list
      (dict "k" "username" "path" $opPath "prop" "db_username")
      (dict "k" "password" "path" $opPath "prop" "db_password")))
-}}
{{- with $op.configFilesTokenSecret }}
{{- if .path }}
{{- $secrets = append $secrets (dict "name" "keycloak-op-config-token" "data" (list
      (dict "k" "token" "path" .path "prop" (.property | default "token")))) }}
{{- end }}
{{- end }}
{{- with $op.smtpPasswordSecret }}
{{- if .path }}
{{- $secrets = append $secrets (dict "name" "keycloak-op-smtp" "data" (list
      (dict "k" "SMTP_PASSWORD" "path" .path "prop" (.property | default "smtp_password")))) }}
{{- end }}
{{- end }}
{{- range $secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ include "common.names.namespace" $ | quote }}
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: keycloak-operator
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $store }}
    kind: ClusterSecretStore
  target:
    name: {{ .name }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range .data }}
    - secretKey: {{ .k }}
      remoteRef:
        key: {{ .path }}
        property: {{ .prop }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    {{- end }}
{{- end }}
{{- end }}
