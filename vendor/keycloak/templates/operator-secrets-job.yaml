{{- if and .Values.operator.enabled (eq (.Values.operator.secretsSource | default "eso") "job") }}
{{- /*
Secrets del CR Keycloak SIN ESO (conector externo). El Operator genera el StatefulSet de
Keycloak y solo acepta Secrets de Kubernetes, asi que el webhook de vault no le sirve. Este
Job si lo muta el webhook (vault-env resuelve los `vault:` del env) y vuelca a Secrets:

  keycloak-admin-secret     username/password del admin del master (bootstrapAdmin). La
                            password es la de OpenBao <ns>-keycloak#admin, la MISMA que usan
                            el realm-hardening y el send-credentials-email.
  keycloak-op-config-token  token para bajar realm/SPI/theme (solo con configFilesToken).
  keycloak-op-smtp          SMTP_PASSWORD (solo con realm.smtp.mode=literal).

La BD no pasa por aqui: el usuario <ns>_keycloak_op lo crea el operador de Postgres
(Zalando) y su Secret se usa directamente (operator.db.secretName).

Es un hook Sync (wave -1): corre en cada sync, antes del CR, y es idempotente (apply
server-side, sin last-applied-configuration con el secreto dentro). Si vault-env no
resolvio un valor (el webhook no muto el pod) el Job falla en vez de guardar el literal
`vault:...` como password.
*/ -}}
{{- $op := .Values.operator -}}
{{- $j := $op.secretsJob -}}
{{- $ns := include "common.names.namespace" . -}}
{{- $sa := $j.serviceAccountName | default "keycloak-op-secrets-sa" -}}
{{- $smtpLiteral := eq (($op.realm.smtp | default dict).mode | default "none") "literal" -}}
{{- $names := list "keycloak-admin-secret" -}}
{{- if $j.configFilesToken }}{{- $names = append $names "keycloak-op-config-token" -}}{{- end }}
{{- if $smtpLiteral }}{{- $names = append $names "keycloak-op-smtp" -}}{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ $ns | quote }}
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: keycloak-operator-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keycloak-op-secrets
  namespace: {{ $ns | quote }}
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: keycloak-operator-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  # create no admite resourceNames; el resto solo sobre los Secrets de este Job.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: {{- toYaml $names | nindent 6 }}
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-op-secrets
  namespace: {{ $ns | quote }}
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: keycloak-operator-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: keycloak-op-secrets
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $ns | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-op-secrets
  namespace: {{ $ns | quote }}
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: keycloak-operator-secrets
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # Never + reintentos del Job: cada intento es un pod NUEVO, que el webhook muta si ya
  # esta arriba. Con OnFailure se reiniciaria el mismo pod, y si nacio antes que el
  # webhook (despliegue desde cero) se quedaria para siempre con los `vault:` sin resolver.
  # 12 reintentos con el backoff de Kubernetes (hasta 6 min) son ~50 min.
  backoffLimit: {{ $j.backoffLimit | default 12 }}
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/component: keycloak-operator-secrets
      annotations:
        vault.security.banzaicloud.io/vault-addr: {{ required "operator.secretsJob.vault.addr" $j.vault.addr | quote }}
        {{- with $j.vault.tlsSecret }}
        vault.security.banzaicloud.io/vault-tls-secret: {{ . | quote }}
        {{- end }}
        vault.security.banzaicloud.io/vault-role: {{ required "operator.secretsJob.vault.role" $j.vault.role | quote }}
        vault.security.banzaicloud.io/vault-env-image: {{ $j.vault.envImage | quote }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $sa }}
      automountServiceAccountToken: true
      {{- include "keycloak.imagePullSecrets" . | nindent 6 }}
      {{- with $op.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      # Mismo motivo que el realm-hardening: el webhook deja /vault/ como unico montaje y se
      # pierde el token proyectado del SA, que necesitan vault-env y kubectl.
      volumes:
        - name: sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        - name: tmp
          emptyDir:
            medium: Memory
      containers:
        - name: keycloak-op-secrets
          image: {{ $j.image | quote }}
          imagePullPolicy: IfNotPresent
          # command explicito: vault-env necesita saber que ejecutar.
          command: ["/bin/sh", "-c"]
          volumeMounts:
            - name: sa-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: tmp
              mountPath: /work
          env:
            - name: ADMIN_USERNAME
              value: {{ $op.adminUsername | default "admin" | quote }}
            - name: ADMIN_PASSWORD
              value: {{ required "operator.secretsJob.adminPassword" $j.adminPassword | quote }}
            {{- with $j.configFilesToken }}
            - name: CONFIG_FILES_TOKEN
              value: {{ . | quote }}
            {{- end }}
            {{- if $smtpLiteral }}
            - name: SMTP_PASSWORD
              value: {{ required "operator.secretsJob.smtpPassword (realm.smtp.mode=literal)" $j.smtpPassword | quote }}
            {{- end }}
          args:
            - |
              set -eu
              umask 077
              NS="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"

              # <secret> <clave>=<variable> ...: valores por fichero, nunca en la linea de comandos.
              volcar() {
                name="$1"; shift
                dir="/work/${name}"; mkdir -p "${dir}"
                args=""
                for kv in "$@"; do
                  key="${kv%%=*}"; var="${kv#*=}"
                  eval "val=\${${var}:-}"
                  if [ -z "${val}" ]; then echo "ERROR: ${var} vacio (${name}/${key})" >&2; exit 1; fi
                  case "${val}" in vault:*) echo "ERROR: ${var} sin resolver: el webhook de vault no muto el pod" >&2; exit 1;; esac
                  printf '%s' "${val}" > "${dir}/${key}"
                  args="${args} --from-file=${key}=${dir}/${key}"
                done
                # shellcheck disable=SC2086
                kubectl -n "${NS}" create secret generic "${name}" ${args} --dry-run=client -o yaml \
                  | kubectl label --local -f - -o yaml \
                      app.kubernetes.io/name=keycloak \
                      app.kubernetes.io/component=keycloak-operator-secrets \
                  | kubectl apply --server-side --force-conflicts --field-manager=keycloak-op-secrets -f - >/dev/null
                rm -rf "${dir}"
                echo "OK ${name}"
              }

              volcar keycloak-admin-secret username=ADMIN_USERNAME password=ADMIN_PASSWORD
              {{- if $j.configFilesToken }}
              volcar keycloak-op-config-token token=CONFIG_FILES_TOKEN
              {{- end }}
              {{- if $smtpLiteral }}
              volcar keycloak-op-smtp SMTP_PASSWORD=SMTP_PASSWORD
              {{- end }}
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
{{- end }}
