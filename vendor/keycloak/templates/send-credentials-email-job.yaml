{{- if .Values.sendCredentialsEmail.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-send-credentials-email" (include "common.names.fullname" .) | trunc 63 | trimSuffix "-" }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: send-credentials-email
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # Despues de realm-hardening-job (weight por defecto 0): no es estrictamente necesario,
    # pero evita ejecutar execute-actions-email contra un realm a medio endurecer.
    argocd.argoproj.io/hook-weight: "1"
spec:
  backoffLimit: {{ .Values.sendCredentialsEmail.backoffLimit | default 5 }}
  ttlSecondsAfterFinished: {{ .Values.sendCredentialsEmail.ttlSecondsAfterFinished | default 600 }}
  template:
    metadata:
      labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 8 }}
        app.kubernetes.io/component: send-credentials-email
      annotations:
        vault.security.banzaicloud.io/vault-addr: {{ .Values.sendCredentialsEmail.vault.addr | quote }}
        {{- with .Values.sendCredentialsEmail.vault.tlsSecret }}
        vault.security.banzaicloud.io/vault-tls-secret: {{ . | quote }}
        {{- end }}
        vault.security.banzaicloud.io/vault-role: {{ .Values.sendCredentialsEmail.vault.role | quote }}
        vault.security.banzaicloud.io/vault-env-image: {{ .Values.sendCredentialsEmail.vault.envImage | quote }}
    spec:
      restartPolicy: OnFailure
      # Mismo motivo que realm-hardening-job: el webhook de vault-env solo deja /vault/ montado,
      # asi que montamos el token de SA a mano para no perderlo.
      serviceAccountName: {{ include "keycloak.serviceAccountName" . }}
      automountServiceAccountToken: true
      {{- include "keycloak.imagePullSecrets" . | nindent 6 }}
      volumes:
        - name: sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
      containers:
        - name: send-credentials-email
          image: {{ .Values.sendCredentialsEmail.image | quote }}
          imagePullPolicy: {{ .Values.sendCredentialsEmail.imagePullPolicy | default "IfNotPresent" }}
          volumeMounts:
            - name: sa-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          env:
            - name: KC_URL
              value: {{ .Values.sendCredentialsEmail.keycloakUrl | quote }}
            - name: KC_ADMIN_USER
              value: {{ .Values.sendCredentialsEmail.adminUser | quote }}
            - name: KC_ADMIN_PASSWORD
              value: {{ .Values.sendCredentialsEmail.adminPassword | quote }}
            - name: REALM
              value: {{ .Values.sendCredentialsEmail.realm | quote }}
            - name: CLIENT_ID
              value: {{ .Values.sendCredentialsEmail.clientId | quote }}
            - name: REDIRECT_URI
              value: {{ .Values.sendCredentialsEmail.redirectUri | quote }}
            - name: USERNAMES
              value: {{ .Values.sendCredentialsEmail.usernames | join "," | quote }}
            - name: REQUIRED_ACTIONS
              value: {{ .Values.sendCredentialsEmail.requiredActions | default (list "UPDATE_PASSWORD" "CONFIGURE_TOTP") | toJson | quote }}
            - name: WAIT_RETRIES
              value: {{ .Values.sendCredentialsEmail.waitRetries | default 60 | quote }}
            - name: WAIT_SLEEP_SECONDS
              value: {{ .Values.sendCredentialsEmail.waitSleepSeconds | default 5 | quote }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              KCADM=/opt/bitnami/keycloak/bin/kcadm.sh
              KCADM_CONFIG=/tmp/kcadm.config

              echo "Waiting for Keycloak at ${KC_URL}/realms/master ..."
              for i in $(seq 1 "${WAIT_RETRIES}"); do
                if curl -sf "${KC_URL}/realms/master" -o /dev/null; then
                  echo "Keycloak is up."
                  break
                fi
                if [ "${i}" -eq "${WAIT_RETRIES}" ]; then
                  echo "Timed out waiting for Keycloak." >&2
                  exit 1
                fi
                sleep "${WAIT_SLEEP_SECONDS}"
              done

              echo "Authenticating to master realm as ${KC_ADMIN_USER}..."
              "${KCADM}" config credentials --config "${KCADM_CONFIG}" \
                --server "${KC_URL}" \
                --realm master \
                --user "${KC_ADMIN_USER}" \
                --password "${KC_ADMIN_PASSWORD}"

              # redirect_uri y client_id van como query string del propio endpoint
              # execute-actions-email (no son campos del body: el body es solo el
              # array de required actions). kcadm admite la query pegada al path.
              urlencode() {
                local s="$1" out="" c
                local i
                for (( i=0; i<${#s}; i++ )); do
                  c="${s:$i:1}"
                  case "$c" in
                    [a-zA-Z0-9.~_-]) out+="$c" ;;
                    *) printf -v hex '%%%02X' "'$c"; out+="$hex" ;;
                  esac
                done
                printf '%s' "$out"
              }
              ENC_REDIRECT=$(urlencode "${REDIRECT_URI}")

              IFS=',' read -r -a USERNAME_LIST <<< "${USERNAMES}"
              for username in "${USERNAME_LIST[@]}"; do
                [ -z "${username}" ] && continue
                id=$("${KCADM}" get users --config "${KCADM_CONFIG}" -r "${REALM}" \
                  -q "username=${username}" --fields id --format csv --noquotes 2>/dev/null | tail -n1 | tr -d '"\r')
                if [ -z "${id}" ]; then
                  echo "WARN: no se encontro el usuario ${username} en el realm ${REALM}, se omite" >&2
                  continue
                fi
                echo "Enviando correo de alta a ${username} (id ${id})..."
                "${KCADM}" update "users/${id}/execute-actions-email?client_id=${CLIENT_ID}&redirect_uri=${ENC_REDIRECT}" \
                  --config "${KCADM_CONFIG}" -r "${REALM}" -b "${REQUIRED_ACTIONS}"
                echo "OK: ${username}"
              done

              echo "Correos de alta enviados."
{{- end }}
