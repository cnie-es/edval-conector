# Manual OpenBao Initialization Job
# Usage: kubectl apply -f manual-init-job.yaml -n <namespace>
# This job performs the initial OpenBao setup when needed manually

apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-init-manual
  namespace: simplcommon  # Change this to your target namespace
spec:
  template:
    spec:
      serviceAccountName: openbao-simplcommon-svc-account  # Change simpl-common to your namespace
      imagePullSecrets:
        - name: github-registry-secret
      initContainers:
      - name: 0-init
        image: "docker.io/openbao/openbao:2.4.3"
        command: [sh, -c]
        args:
          - |
            # Use seal-status endpoint with GET instead of spider (HEAD)
            until wget -O /dev/null --quiet --timeout=10 --tries=1 --no-check-certificate $VAULT_ADDR/v1/sys/seal-status 2>/dev/null; do
              echo "Waiting for OpenBao to be accessible..."
              sleep 5
            done

            bao operator init -format json >> /data/init.json || {
              echo "Init failed (possibly already initialized), continuing..."
            }
        env:
          - name: VAULT_ADDR
            value: http://openbao-simplcommon:8200  # Change simpl-common to your namespace
          - name: VAULT_SKIP_VERIFY
            value: "true"
        volumeMounts:
        - name: init-bao-volume
          mountPath: /data
      - name: 1-bao-secret
        image: "docker.io/alpine/k8s:1.35.2"
        command: [sh, -c]
        args:
          - |
            if [ -f /etc/alpine-release ]; then apk add jq; fi

            timeout 300 sh -c 'while [ ! -f /data/init.json ]; do sleep 5; done' || exit 1

            UNSEAL_KEYS=$(cat /data/init.json | jq -r '.unseal_keys_b64[]')
            ROOT_TOKEN=$(cat /data/init.json | jq -r '.root_token')

            # Create secret with unseal keys
            echo "y" | kubectl delete secret secrets-unseal-keys -i
            kubectl create secret generic secrets-unseal-keys \
              --from-literal=key1=$(echo $UNSEAL_KEYS | cut -d' ' -f1) \
              --from-literal=key2=$(echo $UNSEAL_KEYS | cut -d' ' -f2) \
              --from-literal=key3=$(echo $UNSEAL_KEYS | cut -d' ' -f3) \
              --from-literal=key4=$(echo $UNSEAL_KEYS | cut -d' ' -f2) \
              --from-literal=key5=$(echo $UNSEAL_KEYS | cut -d' ' -f2) || true

            # Create secret with root token
            echo "y" | kubectl delete secret secrets-root-token -i
            kubectl create secret generic secrets-root-token \
              --from-literal=token=$ROOT_TOKEN || true
        volumeMounts:
        - name: init-bao-volume
          mountPath: /data
      containers:
      - name: final-step
        image: docker.io/library/busybox:1.37.0
        command: ['sh', '-c', 'echo "Manual initialization complete"']
        volumeMounts:
        - name: init-bao-volume
          mountPath: /data
      restartPolicy: Never
      volumes:
      - name: init-bao-volume
        persistentVolumeClaim:
          claimName: init-bao-simplcommon-pvc  # Change simpl-common to your namespace
