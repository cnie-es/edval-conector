kafkaConfig: {}

profile: "" # authority or participant

#path of extra config to add to the deploy, separated by comma
extraConfigImport: /config/kafka.yml,classpath:config/routes-{{ .Values.profile }}.yml

microservices:
  usersRolesUrl: http://users-roles.{{ .Release.Namespace }}.svc.cluster.local:8080
  securityAttributesProviderUrl: http://security-attributes-provider.{{ .Release.Namespace }}.svc.cluster.local:8080
  identityProviderUrl: http://identity-provider.{{ .Release.Namespace }}.svc.cluster.local:8080
  authenticationProviderUrl: http://authentication-provider.{{ .Release.Namespace }}.svc.cluster.local:8080

redis:
  host: "redis-master.{{ .Release.Namespace }}.svc.cluster.local"
  port: "6379"
  username: "default"
  password: "admin"

hostT2: "your-t2-host"
authorityUrlT1: "authority-t1-url"
authorityAuthProviderUrl: "{{ .Values.authorityUrlT1 }}/authApi"

keypair:
  algorithm: EC

devMode: false

initContainers:
  checkAuthProvider:
    checkCredentialPresence:
      enabled: true

