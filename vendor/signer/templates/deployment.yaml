apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ template "app.name" . }}"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/instance: {{ include "app.revision" . }}
    app.kubernetes.io/part-of: rse
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.deployment.strategy.type }}
    rollingUpdate:
      maxSurge: {{ .Values.deployment.strategy.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.deployment.strategy.rollingUpdate.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
      annotations:
        {{- include "app.metricsAnnotations" . | nindent 8 }}
{{- if .Values.podAnnotations }}
{{ toYaml .Values.podAnnotations | indent 8 }}
{{- end }}
    spec:
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken | default false }}
      serviceAccountName: {{ .Values.serviceAccount.name | default .Release.Namespace }}
      securityContext:
        seccompProfile:
          type: {{ .Values.podSecurityContext.seccompProfile.type }}
      {{- if $.Values.image.pullSecrets }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecrets }}
      {{- end }}
      volumes:
        - name: vault-secrets
          emptyDir: { }
        - name: sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: {{ .Values.serviceAccount.tokenExpirationSeconds }}
                  audience: {{ .Values.vault.auth.kubernetesAudience | quote }}
      initContainers:
        - name: {{ .Values.vault.initContainer.name }}
          image: {{ .Values.vault.initContainer.image }}
          command: [ "/bin/sh", "-c" ]
          args:
            - |
              apk add --no-cache curl jq

              export SA_TOKEN=$(cat {{ .Values.vault.volumes.serviceAccountTokenMountPath }}/token)
              export VAULT_ADDR="{{ .Values.vault.address }}"

              while true; do
                RESPONSE=$(curl -s -w "\n%{http_code}" --request POST \
                --data '{"jwt": "'"$SA_TOKEN"'", "role": "{{ .Values.vault.role }}"}' \
                  $VAULT_ADDR{{ .Values.vault.auth.kubernetesLoginPath }})

                HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
                LOGIN_RESPONSE=$(echo "$RESPONSE" | head -n -1)

                if [ "$HTTP_STATUS" -eq 200 ]; then
                  echo "Successfully logged in to Vault"
                  break
                else
                  echo "Vault login failed with status code: $HTTP_STATUS. Response: $LOGIN_RESPONSE. Retrying in {{ .Values.vault.retry.intervalSeconds }} seconds..."
                  sleep {{ .Values.vault.retry.intervalSeconds }}
                fi
              done

              VAULT_TOKEN=$(echo $LOGIN_RESPONSE | jq -r '.auth.client_token')

              while true; do
                RESPONSE=$(curl -s -w "\n%{http_code}" \
                  -H "X-Vault-Token: $VAULT_TOKEN" \
                  $VAULT_ADDR{{ .Values.vault.secretPath }})

                HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
                SECRET_RESPONSE=$(echo "$RESPONSE" | head -n -1)

                if [ "$HTTP_STATUS" -eq 200 ]; then
                  echo "Successfully retrieved secrets from Vault"
                  SECRET_JSON="$SECRET_RESPONSE"
                  break
                else
                  echo "Failed to fetch secrets with status code: $HTTP_STATUS. Response: $SECRET_RESPONSE. Retrying in {{ .Values.vault.retry.intervalSeconds }} seconds..."
                  sleep {{ .Values.vault.retry.intervalSeconds }}
                fi
              done

              echo $SECRET_JSON | jq -r '{{ .Values.vault.secretDataJqPath }} | to_entries[] | "export \(.key)=\"\(.value)\"\n"' > {{ .Values.vault.volumes.secretsFilePath }}

          volumeMounts:
            - name: sa-token
              mountPath: {{ .Values.vault.volumes.serviceAccountTokenMountPath }}
              readOnly: true
            - name: vault-secrets
              mountPath: {{ .Values.vault.volumes.secretsMountPath }}
      containers:
      - name: {{ template "app.name" . }}
        image: "code.europa.eu:4567/simpl/simpl-open/development/gaia-x-edc/poc-gaia-edc/signer:0.0.1"
        imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
        command: [ "/bin/sh" ]
        args:
          - -c
          # '.' y no 'source': el contenedor arranca con /bin/sh, donde source no existe (es de bash).
          - . {{ .Values.vault.volumes.secretsFilePath }} && cd {{ .Values.app.workDir }} && {{ .Values.app.binaryPath }}
        volumeMounts:
          - name: vault-secrets
            mountPath: {{ .Values.vault.volumes.secretsMountPath }}
        ports:
        {{- if .Values.metrics.enabled }}
          - name: monitoring
            containerPort: {{ .Values.metrics.port }}
        {{- end }}
          - name: {{ .Values.service.portName }}
            containerPort: {{ .Values.signer.http.port }}
        {{- with .Values.env }}
        env:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        readinessProbe:
          httpGet:
            path: {{ .Values.probes.readiness.path }}
            port: {{ .Values.probes.readiness.port }}
          initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          successThreshold: {{ .Values.probes.readiness.successThreshold }}
          failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
        resources:
{{ toYaml .Values.resources | indent 10 }}
