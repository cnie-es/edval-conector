# -- Default number of instances to start 
replicaCount: 1
# -- Application name
name: signer
# -- Ovverwrites application name
nameOverride: ""

image:
  repository: code.europa.eu:4567/simpl/gaia-x-edc/poc-gaia-edc
  # -- Image name
  name: signer
  tag: "latest"
  pullPolicy: Always

secretConfigPath: common/dataprovider01-signer-dataprovider01

hashicorp:
  role: "common-role"
  service: "http://vault-common01.common01.svc.cluster.local:8200"

podAnnotations: {}

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 150m
    memory: 128Mi

autoscaling:
  # -- Enable autoscaling
  enabled: false
  # -- Minimum replicas
  minReplicas: 1
  # -- Maximum replicas
  maxReplicas: 3
  # -- CPU target for autoscaling trigger
  targetCPUUtilizationPercentage: 70
  # -- Memory target for autoscaling trigger
  targetMemoryUtilizationPercentage: 70

metrics:
  # -- Enable prometheus metrics
  enabled: true
  # -- Port for prometheus metrics
  port: 2112

security:
  # -- by default, apps run as non-root
  runAsNonRoot: false
  # -- User used by the apps
  runAsUid: 0
  # -- Group used by the apps
  runAsGid: 0

service:
  port: 8080

serviceAccount:
  automountServiceAccountToken: false
  enabled: true

signer:
  http:
    host: ""
    port: 8080


ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: "dev-prod"
    #Having this edit in place set to "true" make the rewrite rule below conflicting with acme http01 validation
    acme.cert-manager.io/http01-edit-in-place: "false"
    kubernetes.io/ingress.class: nginx
  tlsEnabled: true
  frontendDomain: signer.sandbox-cat-dat.simpl-europe.eu
  frontendTlsSecretName: signer-manager-tls

