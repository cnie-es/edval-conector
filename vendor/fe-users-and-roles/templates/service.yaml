apiVersion: v1
kind: Service
metadata:
  name: {{ $.Chart.Name }}-{{ $.Values.name }}
  labels:
    {{- include "simplFe.labels" . | nindent 4 }}
spec:
  type: {{ $.Values.service.type }}
  ports:
    - port: {{ $.Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "simplFe.selectorLabels" . | nindent 4 }}
