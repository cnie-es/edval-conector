name: pg-cluster
volumeSize: 20Gi
storageClass: ""
instances: 3
maxConnections: 500
image:
  registry: ghcr.io
  repository: zalando/spilo-17
  tag: 4.0-p2
resources:
  requests:
    cpu: 10m
    memory: 100Mi
  limits:
    cpu: 500m
    memory: 500Mi

authorityList: {}

consumerList: {}

providerList: {}

# true = usuario y BD <participante>_keycloak_op para el Keycloak del Operator
# (keycloakOperator.enabled del umbrella). Con false el manifiesto no cambia.
keycloakOperatorDb: false
