{{- if .Values.embeddedCommon.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "{{ .Values.argocd.appname }}-vswh"
  namespace: {{ .Values.argocd.namespace }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"

spec:
  syncPolicy:
    automated: {}
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    - kind: Secret
      name: "vault-webhook-{{ .Values.cluster.namespace }}-webhook-tls"
      jsonPointers:
        - /data
    - kind: Deployment
      name: "vault-webhook-{{ .Values.cluster.namespace }}"
      jsonPointers:
        - /metadata/generation
        - /metadata/annotations
        - /spec/template/metadata/annotations
        - /spec/progressDeadlineSeconds
        - /spec/revisionHistoryLimit
        - /spec/strategy
        - /spec/template/spec/dnsPolicy
        - /spec/template/spec/restartPolicy
        - /spec/template/spec/schedulerName
        - /spec/template/spec/securityContext
        - /spec/template/spec/serviceAccount
        - /spec/template/spec/terminationGracePeriodSeconds
        - /spec/template/spec/containers/0/ports/0/protocol
        - /spec/template/spec/containers/0/terminationMessagePath
        - /spec/template/spec/containers/0/terminationMessagePolicy
  project: {{ .Values.project }}
  destination:
    server: {{ .Values.cluster.address }}
    namespace: "{{ .Values.cluster.namespace }}-vswh"
  sources:
  - repoURL: {{ .Values.values.repo_URL }}
    targetRevision: {{ .Values.values.branch }}
    ref: values
  - repoURL: {{ .Values.vault_webhook.repo_URL }}
    targetRevision: {{ .Values.vault_webhook.targetRevision }}
    path: {{ .Values.vault_webhook.path }}
    helm:
      {{- /* Sin valueFiles no se emite la clave: vacia queda en null y la API rechaza la Application. */}}
      {{- with .Values.vault_webhook.valueFiles }}
      valueFiles:
        {{- range . }}
        - $values/app-values/vault-webhook/{{ . }}
        {{- end }}
      {{- end }}
      values: |
        watchNamespace: {{ .Values.cluster.namespace }}
        fullnameOverride: vault-webhook-{{ .Values.cluster.namespace }}
        serviceAccount:
          name: vault-webhook-service-account
        imagePullSecrets:
          - name: github-registry-secret
        namespaceSelector:
          matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: In
              values:
                - {{ .Values.cluster.namespace }}
                {{- range .Values.agentList.authorities }}
                - {{ . }}
                {{- end }}
                {{- range .Values.agentList.consumers }}
                - {{ . }}
                {{- end }}
                {{- range .Values.agentList.providers }}
                - {{ . }}
                {{- end }}
        certificate:
          generate: false
          useCertManager: true
        image:
          # El Chart.yaml del webhook dice appVersion: latest; sin fijarlo la imagen va a :latest.
          tag: {{ .Values.vault_webhook.webhookImageTag | quote }}
        vaultEnv:
          repository: "ghcr.io/bank-vaults/vault-env"
          # Con "v": a secas "1.22.1" no existe en ghcr.io/bank-vaults/vault-env (confirmado,
          # NotFound/ImagePullBackOff). Es el default que usa cualquier componente que NO fije
          # su propia anotacion vault.security.banzaicloud.io/vault-env-image (la mayoria de los
          # nuestros si la fijan con "v"; los componentes EDVAL externos, como
          # edc-connector-adapter, no la traen y caen en este default). Visto en vivo en
          # extletest/eks-external-rioja.
          tag: "v1.22.1"
        env:
          VAULT_ADDR: "http://openbao-{{ .Values.cluster.namespace }}.{{ .Values.cluster.namespace }}.svc.cluster.local:8200"
          VAULT_ENV_VAULT_ADDR: "http://openbao-{{ .Values.cluster.namespace }}.{{ .Values.cluster.namespace }}.svc.cluster.local:8200"
          VAULT_ROLE: "{{ .Values.secrets.secretEngine }}-role"
          VAULT_IMAGE: "{{ .Values.vault_webhook.image.repository }}:{{ .Values.vault_webhook.image.tag }}"
          # El webhook rechaza (silenciosamente: failurePolicy=Ignore, el pod arranca SIN
          # mutar) cualquier vault.security.banzaicloud.io/vault-addr que no este en esta
          # lista. La mayoria de los pods del participante (Keycloak, contract, etc.) piden
          # el host PUBLICO de OpenBao (vault-addr: https://secrets-<common>.<dominio>), no
          # el Service interno de VAULT_ADDR de arriba. Sin este allowlist, el error queda
          # solo en los logs del propio webhook ("address ... is not in the configured
          # allowlist") y el pod sigue con el valor LITERAL "vault:..." como si fuera la
          # password/secreto real — visto en vivo en extletest/eks-external-rioja
          # (Keycloak: "password authentication failed for user ..." con la cadena
          # vault:simpl-secrets/... sin resolver).
          VAULT_ADDR_ALLOWLIST: "http://openbao-{{ .Values.cluster.namespace }}.{{ .Values.cluster.namespace }}.svc.cluster.local:8200,https://secrets-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}"
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.vault_webhook.resources }}
        resources: {{- toYaml .Values.vault_webhook.resources | nindent 10 }}
          {{- end }}
        {{- end }}
{{- end }}
