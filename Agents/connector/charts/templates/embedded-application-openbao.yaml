{{- if .Values.embeddedCommon.enabled }}
# Common embebido en el conector: servidor OpenBao (Shamir) + openbao-init.
# Portado de common_components/charts/templates/application-openbao.yaml.
# Se activa solo con embeddedCommon.enabled=true (participante externo autocontenido).
# Sin Namespace aqui: lo crea el deployer (syncOptions CreateNamespace=true) o lo declara el
# participante en su app-of-apps. Declararlo tambien aqui daba DOS duenos en ArgoCD: cada app
# reescribe el tracking-id al sincronizar y la otra queda OutOfSync, alternandose sin fin.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "{{ .Values.argocd.appname }}-openbao"
  namespace: {{ .Values.argocd.namespace }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences:
  - kind: Secret
    name: redis-secrets
    namespace: {{ .Values.cluster.namespace }}
    jsonPointers:
      - /data
  - kind: Secret
    name: kafka-users-secret
    jsonPointers:
      - /data
  - kind: Secret
    name: keycloak-secrets
    jsonPointers:
      - /data
  project: {{ .Values.project }}
  destination:
    server: {{ .Values.cluster.address }}
    namespace: "{{ .Values.cluster.namespace }}"
  sources:
  - repoURL: {{ .Values.values.repo_URL }}
    targetRevision: {{ .Values.values.branch }}
    ref: values
  - repoURL: {{ .Values.openbao.repo_URL }}
    targetRevision: {{ .Values.openbao.targetRevision }}
    path: {{ .Values.openbao.path }}
    helm:
      valueFiles:
        {{- range .Values.openbao.valueFiles }}
        - $values/Agents/connector/app-values/openbao/{{ . }}
        {{- end }}
      values: |
        fullnameOverride: openbao-{{ .Release.Namespace }}
        injector:
          agentImage:
            registry: docker.io
            repository: openbao/openbao
            tag: "2.4.3"
          {{- /*
            Sin injector.externalVaultAddr: en openbao-helm ese valor pone el chart en modo
            "external" (_helpers.tpl, openbao.mode) y entonces NO despliega el servidor, ni su
            StatefulSet ni su Ingress. El conector se quedaba sin OpenBao.
          */}}
          {{- if .Values.nodeSelector }}
          nodeSelector: {{- toYaml .Values.nodeSelector | nindent 12 }}
          {{- end }}
          webhook:
            namespaceSelector:
              matchExpressions:
                - key: kubernetes.io/metadata.name
                  operator: In
                  values:
                    - {{ .Values.cluster.namespace }}
        server:
          {{- if .Values.openbao.storageClassName }}
          dataStorage:
            storageClass: {{ .Values.openbao.storageClassName }}
          {{- end }}
          {{- if .Values.nodeSelector }}
          nodeSelector: {{- toYaml .Values.nodeSelector | nindent 12 }}
          {{- end }}
          ingress:
            {{- /* tls.perHost: certificado propio del host, emitido por cert-manager con cluster.issuer. */}}
            {{- if (.Values.tls).perHost }}
            annotations:
              cert-manager.io/cluster-issuer: {{ .Values.cluster.issuer }}
            {{- end }}
            hosts:
              - host: secrets-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}
            tls:
              - secretName: {{ include "connector.openbaoTlsSecret" . }}
                hosts:
                  - secrets-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}
          # Shamir seal (default); unseal handled by openbao-init job + watchdog
          serviceAccount:
            create: true
            name: openbao
          {{- /*
            El listener tiene tls_disable = 1, asi que OpenBao no lee este montaje; se mantiene en
            modo wildcard para no cambiar el pod de los despliegues que ya existen. Con tls.perHost
            se omite: montar un Secret que emite cert-manager dejaria el pod esperando a que exista,
            y el certificado depende a su vez de que el ingress este publicado.
          */}}
          {{- if not (.Values.tls).perHost }}
          volumes:
            - name: wildcard-tls
              secret:
                secretName: {{ include "connector.openbaoTlsSecret" . }}
          volumeMounts:
            - mountPath: /vault/tls
              name: wildcard-tls
              readOnly: true
          {{- end }}
          standalone:
            config: |
              ui = true
              listener "tcp" {
                tls_disable = 1
                address = "[::]:8200"
                cluster_address = "[::]:8201"
              }
              storage "file" {
                path = "/openbao/data"
              }
          ha:
            enabled: false
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: "OnRootMismatch"
        {{- if .Values.openbao.resources }}
        resources: {{- toYaml .Values.openbao.resources | nindent 10 }}
        {{- end }}
  - repoURL: {{ required "openbao_init.repo_URL es obligatorio con el openbao embebido activo: no hay default porque el anterior apuntaba a un repo obsoleto e inaccesible" .Values.openbao_init.repo_URL }}
    targetRevision: {{ .Values.openbao_init.targetRevision }}
    path: {{ .Values.openbao_init.path | default "charts" }}
    helm:
      values: |
        cluster:
          namespace: {{ .Values.cluster.namespace }}
        {{- if .Values.openbao_init.storageClassName }}
        storageClassName: {{ .Values.openbao_init.storageClassName }}
        {{- end }}
        # redis-secrets de este namespace lo declara openbao-seeder (con las guardas contra la
        # rotacion). Declararlo tambien aqui da dos duenos en ArgoCD.
        redisSecret:
          create: false
        namespaceTag: {{ .Values.namespaceTag.common }}
        domainSuffix: {{ .Values.domainSuffix }}
        openbaoHost: secrets-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}
        secrets:
          secretEngine: {{ .Values.secrets.secretEngine }}
          role: {{ .Values.secrets.role }}
        agentList:
          authorities: []
          consumers: []
          providers: []
          # HIBRIDO (contract_consumer.enabled, el default salvo que se aplique el overlay
          # values-role-provider.yaml/-consumer.yaml): este namespace corre a la vez una 2a
          # instancia de contract (consumer) y contract-consumption-be/edc-connector-adapter
          # en modo consumer, que necesitan sus propios campos en kafka-users-secret ademas
          # de los ya cubiertos por kafkaParticipants.providers de abajo. Ver secrets.yaml.
          {{- if .Values.contract_consumer.enabled }}
          hybrids:
            - {{ .Values.cluster.namespace }}
          {{- else }}
          hybrids: []
          {{- end }}
        # El conector es su propio "common": se siembran las credenciales kafka
        # para este propio participante (provider).
        kafkaParticipants:
          consumers: []
          providers:
            - {{ .Values.cluster.namespace }}
          {{- if .Values.contract_consumer.enabled }}
          hybrids:
            - {{ .Values.cluster.namespace }}
          {{- else }}
          hybrids: []
          {{- end }}
        {{- if .Values.nodeSelector }}
        nodeSelector: {{- toYaml .Values.nodeSelector | nindent 10 }}
        {{- end }}
{{- end }}
