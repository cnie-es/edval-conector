    targetRevision: 1.0.23-edval
    path: charts
    helm:
      releaseName: {{ .Values.simpl_edc.nameOverride }}
      valueFiles:
        {{- range .Values.simpl_edc.valueFiles }}
        - $values/Agents/connector/app-values/simpl-edc/{{ . }}
        {{- end }}
      values: |
        deployment:
          image: {{ .Values.images.simplEdc }}
          tag: {{ .Values.imagesTags.simplEdc }}
          host: {{ .Values.simpl_edc.nameOverride }}-service
          callbackAddress: "https://tls-participant-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/edc"
        env:
          datasourceurl: "jdbc:postgresql://pg-cluster.{{ .Values.cluster.namespace }}.svc.cluster.local:5432/{{ .Values.cluster.namespace }}_edc"
          edcParticipantId: {{ .Values.cluster.namespace }}
        postgresql:
          username: {{ .Values.cluster.namespace }}_edc
        # El chart cnie-es/simpl-edc comprueba tls.url.participantIdSource pero el curl de su init
        # wait-for-participant-id usa tls.participantIdSource: sin esta clave el init llama a curl sin
        # URL ("no URL specified") y el EDC no arranca nunca.
        tls:
          participantIdSource: http://authentication-provider:8080/v1/credentials
        hashicorp:
          {{- with include "connector.vaultCaSecret" $ }}
          tlsSecret: {{ . }}
          {{- end }}
          role: {{ .Values.secrets.role }}
          service: "https://secrets-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}"
        secretEngine: {{ .Values.secrets.secretEngine }}
