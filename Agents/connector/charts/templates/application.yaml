{{- if eq (.Values.adminRealmAccess | default "public") "internal" }}
  {{- if not .Values.adminHost }}
    {{- fail "adminRealmAccess=internal exige adminHost (host de example.invalid para la consola de Keycloak del participante)" }}
  {{- end }}
  {{- if not .Values.adminIngressTarget }}
    {{- fail "adminRealmAccess=internal exige adminIngressTarget (IP del LB interno de vlan123 para external-dns)" }}
  {{- end }}
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.argocd.appname }}
  namespace: {{ .Values.argocd.namespace }}
  annotations:
    # Ola 3: despues de Keycloak (application-keycloak.yaml, ola 2), para que el correo de alta
    # no dependa de que EDC/tier2-proxy esten sanos.
    argocd.argoproj.io/sync-wave: "3"
spec:
  syncPolicy:
    automated: {}
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
      - ServerSideApply=true
  {{- /*
    Sin ignoreDifferences para signer y simpl-files: sus arreglos ('.' en vez de 'source' y el
    emptyDir de /tmp) estan ahora en sus charts de vendor/, y el estado vivo coincide con git.
  */}}
  project: {{ .Values.project }}
  destination:
    server: {{ .Values.cluster.address }}
    namespace: {{ .Values.cluster.namespace }}
  sources:
  - repoURL: {{ .Values.values.repo_URL }}
    targetRevision: {{ .Values.values.branch }}
    ref: values
  # Redis
  # Sin oci://: con el prefijo, ArgoCD 3.x lo trata como artefacto OCI nativo, ignora `chart` y
  # pide .../bitnamicharts/manifests/<version> (401 de Docker Hub). Asi va por Helm OCI y
  # necesita el repositorio registry-1.docker.io/bitnamicharts dado de alta con enableOCI.
  - repoURL: registry-1.docker.io/bitnamicharts
    targetRevision: 19.6.0
    chart: redis
    helm:
      valueFiles:
        {{- range .Values.redis.valueFiles }}
        - $values/Agents/connector/app-values/Redis/{{ . }}
        {{- end }}
      values: |
        fullnameOverride: {{ .Values.redis.nameOverride }}
        {{- /* El ServiceMonitor que activa app-values/Redis solo si el cluster tiene Prometheus Operator: sin el CRD el sync entero falla. */}}
        {{- if not (and .Values.observability.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1")) }}
        metrics:
          serviceMonitor:
            enabled: false
        {{- end }}
        master:
          podAnnotations:
            vault.security.banzaicloud.io/vault-addr: "https://secrets-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}"
            {{- with include "connector.vaultCaSecret" $ }}
            vault.security.banzaicloud.io/vault-tls-secret: {{ . }}
            {{- end }}
            vault.security.banzaicloud.io/vault-role: {{ .Values.secrets.role }}
            vault.security.banzaicloud.io/vault-env-image: "ghcr.io/bank-vaults/vault-env:v1.22.1"
            # Reinicia este pod cuando rote la password de Redis; ver connector.redisSecretChecksum.
            checksum/redis-secret: {{ include "connector.redisSecretChecksum" $ }}
          {{- if .Values.redis.resourcesPreset }}
          resourcesPreset: {{ .Values.redis.resourcesPreset }}
          {{- end }}
          {{- if eq .Values.resourcePreset "low" }}
          resources:
            requests:
              cpu: "0"
              memory: "0"
          {{- else }}
            {{- if .Values.redis.resources }}
          resources: {{- toYaml .Values.redis.resources | nindent 10 }}
            {{- end }}
          {{- end }}
  {{- if .Values.redis_commander.enabled }}
  # Redis Commander
  - repoURL: {{ .Values.redis_commander.repo_URL }}
    targetRevision: {{ .Values.redis_commander.targetRevision }}
    path: {{ .Values.redis_commander.path }}
    helm:
      valueFiles:
        {{- range .Values.redis_commander.valueFiles }}
        - $values/Agents/connector/app-values/Redis_commander/{{ . }}
        {{- end }}
      values: |
        fullnameOverride: {{ .Values.redis_commander.nameOverride }}
        ingress:
          hosts:
          - host: redis-commander-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}
            paths:
              - "/"
          tls:
          - secretName: redis-commander-tls
            hosts:
              - redis-commander-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}
          annotations:
            cert-manager.io/cluster-issuer: {{ .Values.cluster.issuer }}
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.redis_commander.resources }}
        resources: {{- toYaml .Values.redis_commander.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}
  {{- if .Values.sdtooling_api_be.enabled }}
  # SD Tooling API BE
  - repoURL: https://github.com/cnie-es/simpl-sdtooling-api-be.git
    targetRevision: 1.25.0-edval
    path: charts
    helm:
      valueFiles:
        {{- range .Values.sdtooling_api_be.valueFiles }}
        - $values/Agents/connector/app-values/sdtooling-api-be/{{ . }}
        {{- end }}
      values: |
        ingress:
          clusterIssuer: {{ .Values.cluster.issuer }}
        domain: {{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}
        image:
          repository: "ghcr.io/cnie-es/sdtooling-api-be"
          tag: {{ .Values.imagesTags.sdtoolingApiBe }}
        catalogueAdapter:
          tier2Gateway:
            url: "https://tls-authority-{{ .Values.namespaceTag.authority }}.{{ include "connector.authorityDomain" . }}"
        federatedCatalogue:
          tier2Gateway:
            url: "https://tls-authority-{{ .Values.namespaceTag.authority }}.{{ include "connector.authorityDomain" . }}"
        openapiConfig:
          servers: https://sd-creation-wizard-api
        openTelemetry:
          otlpExporter:
            endpoint: http://collector-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}
        hash:
          config:
            algorithm: "SHA256"
            templates: '[
                          {
                            "key": "Contract Template 1",
                            "value": "https://files-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/static/contract/ContractTemplate1.json"
                          },
                          {
                            "key": "Contract Template 2",
                            "value": "https://files-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/static/contract/ContractTemplate2.json"
                          },
                          {
                            "key": "Contract Template 3",
                            "value": "https://files-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/static/contract/ContractTemplate3.json"
                          },
                          {
                            "key": "Billing Schema 1",
                            "value": "https://files-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/static/pdf/BillingSchema1.pdf"
                          },
                          {
                            "key": "Billing Schema 2",
                            "value": "https://files-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/static/pdf/BillingSchema2.pdf"
                          },
                          {
                            "key": "Billing Schema 3",
                            "value": "https://files-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/static/pdf/BillingSchema1.pdf"
                          },
                          {
                            "key": "Sla Agreements 1",
                            "value": "https://files-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/static/pdf/SLAAgreement1.pdf"
                          },
                          {
                            "key": "Sla Agreements 2",
                            "value": "https://files-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/static/pdf/SLAAgreement2.pdf"
                          },
                          {
                            "key": "Sla Agreements 3",
                            "value": "https://files-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/static/pdf/SLAAgreement1.pdf"
                          }
                        ]'
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.sdtooling_api_be.resources }}
        resources: {{- toYaml .Values.sdtooling_api_be.resources | nindent 10 }}
          {{- end }}
        {{- end }}
      releaseName: {{ .Values.sdtooling_api_be.nameOverride }}
  {{- end }}
  {{- if .Values.sdtooling_validation_api_be.enabled }}
  # SD Tooling Validation API BE
  - repoURL: https://code.europa.eu/api/v4/projects/868/packages/helm/stable
    targetRevision: 1.21.0
    chart: sd-creation-wizard
    helm:
      values: |
        image:
          registry: ghcr.io/cnie-es
          tag: {{ .Values.imagesTags.sdtoolingValidationApiBe }}
        openTelemetry:
          otlpExporter:
            endpoint: http://collector-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.sdtooling_validation_api_be.resources }}
        resources: {{- toYaml .Values.sdtooling_validation_api_be.resources | nindent 10 }}
          {{- end }}
        {{- end }}
      valueFiles:
        {{- range .Values.sdtooling_validation_api_be.valueFiles }}
        - $values/Agents/connector/app-values/sdtooling-validation-api-be/{{ . }}
        {{- end }}
      releaseName: {{ .Values.sdtooling_validation_api_be.nameOverride }}
  {{- end }}
  {{- if .Values.xfsc_advsearch_be.enabled }}
  # XFSC Advanced Search BE
  - repoURL: https://code.europa.eu/api/v4/projects/891/packages/helm/stable
    targetRevision: 1.26.0
    chart: xfsc-advsearch
    helm:
      valueFiles:
        {{- range .Values.xfsc_advsearch_be.valueFiles }}
        - $values/Agents/connector/app-values/xfsc-advsearch-be/{{ . }}
        {{- end }}
      values: |
        image:
          registry: ghcr.io/cnie-es
          tag: {{ .Values.imagesTags.xfscAdvsearch }}
        ingress:
          clusterIssuer: {{ .Values.cluster.issuer }}
        domain: {{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}
        catalogueAdapter:
          tier2Gateway:
            url: "https://tls-authority-{{ .Values.namespaceTag.authority }}.{{ include "connector.authorityDomain" . }}"
        federatedCatalogue:
          tier2Gateway:
            url: "https://tls-authority-{{ .Values.namespaceTag.authority }}.{{ include "connector.authorityDomain" . }}"
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.xfsc_advsearch_be.resources }}
        resources: {{- toYaml .Values.xfsc_advsearch_be.resources | nindent 10 }}
          {{- end }}
        {{- end }}
      releaseName: {{ .Values.xfsc_advsearch_be.nameOverride }}
  {{- end }}
  {{- if .Values.contract_consumption_be.enabled }}
  # Contract Consumption BE (capacidad de consumo del Agente hibrido)
  - repoURL: https://github.com/cnie-es/simpl-contract-consumption-be.git
    targetRevision: 1.20.0-edval
    path: charts
    targetRevision: {{ .Values.chartRevisions.contractConsumptionBe }}
    helm:
      valueFiles:
        {{- range .Values.contract_consumption_be.valueFiles }}
        - $values/Agents/connector/app-values/contract-consumption-be/{{ . }}
        {{- end }}
      values: |
        image:
          repository: "ghcr.io/cnie-es/contract-consumption-be"
          tag: {{ .Values.imagesTags.contractConsumptionBe | quote }}
        domain: {{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.contract_consumption_be.resources }}
        resources: {{- toYaml .Values.contract_consumption_be.resources | nindent 10 }}
          {{- end }}
        {{- end }}

        openapiConfig:
          servers: https://creation-wizard-api-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}
        openTelemetry:
          otlpExporter:
            endpoint: http://collector-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}
        vault:
          secretEngine: "{{ .Values.secrets.secretEngine }}"
          secretPath: "{{ .Values.secrets.secretEngine }}/{{ .Values.cluster.namespace }}-contract-consumption-be"
          role: "{{ .Values.secrets.role }}"
          service: "https://secrets-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}"
        kafka:
          bootstrapServers: kafka.{{ .Values.cluster.commonToolsNamespace }}.svc.cluster.local:9092
      releaseName: {{ .Values.contract_consumption_be.nameOverride }}
  {{- end }}
  {{- if .Values.signer.enabled }}
  # Signer
  # Chart en vendor/signer (el publico de code.europa.eu, con el arreglo dentro en vez de un parche en vivo).
  - repoURL: {{ .Values.values.repo_URL }}
    targetRevision: {{ .Values.values.branch }}
    path: vendor/signer
    helm:
      valueFiles:
        {{- range .Values.signer.valueFiles }}
        - $values/Agents/connector/app-values/Signer/{{ . }}
        {{- end }}
      values: |
        serviceAccount:
          name: "{{ .Values.signer.serviceAccountName }}"
        image:
          registry: ghcr.io/cnie-es
          tag: {{ .Values.imagesTags.signer }}
        ingress:
          enabled: false
          frontendDomain: signer-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}
          annotations:
            cert-manager.io/cluster-issuer: {{ .Values.cluster.issuer }}
        # El chart (code.europa.eu/.../signer) NO lee hashicorp.*/secretEngine/secretConfigPath
        # (esas claves no existen en su schema) -- las ignora en silencio y su init container
        # cae al default hardcodeado del chart (un Vault de sandbox de SIMPL-open ajeno,
        # sandbox-cat-dat, "namespace not authorized"). Claves reales confirmadas en su
        # values.yaml publicado: vault.address/role/secretPath. Visto en vivo en
        # extletest/eks-external-rioja.
        vault:
          address: "https://secrets-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}"
          role: {{ .Values.secrets.role }}
          secretPath: "/v1/{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.namespace }}-infra-adapter-simpl-backend"
  {{- end }}
  {{- if .Values.simpl_catalogue_client.enabled }}
  # Simpl Catalogue Client
  - repoURL: https://code.europa.eu/api/v4/projects/937/packages/helm/stable
    targetRevision: 2.9.0
    chart: catalogue-ui
    helm:
      valueFiles:
        {{- range .Values.simpl_catalogue_client.valueFiles }}
        - $values/Agents/connector/app-values/Simpl-catalogue-client/{{ . }}
        {{- end }}
      values: |
        image:
          registry: ghcr.io/cnie-es
          tag: {{ .Values.imagesTags.simplCatalogueClient }}
        env:
          PUBLIC_AUTH_KEYCLOAK_SERVER_URL: "https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}"
          PUBLIC_FC_DATA_URL: "https://tls-authority-{{ .Values.namespaceTag.authority }}.{{ include "connector.authorityDomain" . }}/fc"
          PUBLIC_SEARCH_API_URL: "https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/xfsc-advsearch-be"
          PUBLIC_CONTRACT_CONSUMPTION_API_URL: "https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/contract-consumption"
        ingress:
          className: apisix
          annotations:
            kubernetes.io/ingress.class: apisix
            {{- if (.Values.tls).perHost }}
            cert-manager.io/cluster-issuer: {{ .Values.cluster.issuer }}
            {{- end }}
            k8s.apisix.apache.org/proxy-body-size: 5m
            k8s.apisix.apache.org/proxy-buffering: "on"
            k8s.apisix.apache.org/proxy-buffer-size: "8k"
          hosts:
            - host: catalogue-ui-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}
              paths:
              - path: /*
                pathType: ImplementationSpecific
          tls:
            - secretName: {{ if (.Values.tls).perHost }}{{ printf "catalogue-ui-%s-tls" .Values.namespaceTag.dataprovider }}{{ else }}{{ .Values.wildcardTlsSecretName | default (printf "catalogue-ui-%s-tls" .Values.namespaceTag.dataprovider) }}{{ end }}
              hosts:
                - catalogue-ui-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.simpl_catalogue_client.resources }}
        resources: {{- toYaml .Values.simpl_catalogue_client.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}
  # Tier 1 Gateway
  # Chart en vendor/ con ingressClassName apisix: el original lo trae fijo a nginx y en los clusters
  # del conector solo hay controlador de APISIX.
  - repoURL: {{ .Values.values.repo_URL }}
    targetRevision: {{ .Values.values.branch }}
    path: vendor/tier1-gateway
    helm:
      valueFiles:
        {{- range .Values.tier1_gateway.valueFiles }}
        - $values/Agents/connector/app-values/tier1-gateway/{{ . }}
        {{- end }}
      values: |
        {{- if $.Values.caTrust.enabled }}
        {{- include "connector.javaTrustValues" (dict "root" $ "chart" "tier1-gateway") | nindent 8 }}
        {{- end }}
        hostT1: participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}
        image:
          registry: ghcr.io/cnie-es
          tag: {{ .Values.imagesTags.tier1Gateway }}
        cors:
          allowOrigin: https://participant-fe-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }},https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }},https://infrastructure-fe-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }},https://data-dashboard-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }},http://localhost:4202,http://localhost:3000
        ingress:
          issuer: {{ .Values.cluster.issuer }}
          {{- if .Values.wildcardTlsSecretName }}
          # SaaS interno y externo: usar el cert wildcard configurado (interno=vallelengua-tls,
          # externo=el del participante). Fijar ingress.tls.secretName omite la anotacion
          # cluster-issuer (el letsencrypt per-host no completa el challenge ACME on-prem ->
          # APISIX no publicaria la ruta -> onboarding 404 Route Not Found).
          tls:
            secretName: {{ .Values.wildcardTlsSecretName }}
          {{- end }}
        keycloakUrl: http://keycloak.{{ .Values.cluster.namespace }}.svc.cluster.local
        usersRolesUrl: http://users-roles.{{ .Values.cluster.namespace }}.svc.cluster.local:8080
        authenticationProviderUrl: http://authentication-provider.{{ .Values.cluster.namespace }}.svc.cluster.local:8080
        appConfig:
          jwt-configuration:
            primary:
              realm: participant
          routes:
            microservices-info:
              microservices:
                - name: users-roles
                  internalUrl: "http://users-roles.{{ .Values.cluster.namespace }}.svc.cluster.local:8080/v1"
                  detailUrl: "https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/userApi/v1/"
                - name: authentication-provider
                  internalUrl: "http://authentication-provider.{{ .Values.cluster.namespace }}.svc.cluster.local:8080/v1"
                  detailUrl: "https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/authApi/v1/"
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.tier1_gateway.resources }}
        resources: {{- toYaml .Values.tier1_gateway.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  # Users Roles
  - repoURL: https://github.com/cnie-es/simpl-users-roles.git
    targetRevision: 2.11.2-edval
    path: charts
    helm:
      valueFiles:
        {{- range .Values.users_roles.valueFiles }}
        - $values/Agents/connector/app-values/Users-Roles/{{ . }}
        {{- end }}
      values: |
        podAnnotations:
          vault.security.banzaicloud.io/vault-addr: "https://secrets-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}"
          {{- with include "connector.vaultCaSecret" $ }}
          vault.security.banzaicloud.io/vault-tls-secret: {{ . }}
          {{- end }}
          vault.security.banzaicloud.io/vault-role: {{ .Values.secrets.role }}
          vault.security.banzaicloud.io/vault-env-image: "ghcr.io/bank-vaults/vault-env:v1.22.1"
        hostT1: participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}
        image:
          repository: "ghcr.io/cnie-es/users-roles"
          tag: {{ .Values.imagesTags.usersRoles }}
        authorityHostT2: tls-authority-{{ .Values.namespaceTag.authority }}.{{ include "connector.authorityDomain" . }}
        global:
          ingress:
            issuer: {{ .Values.cluster.issuer }}
        keycloak:
          master:
            password: vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.namespace }}-keycloak#admin
        db:
          url: "jdbc:postgresql://pg-cluster.{{ .Values.cluster.namespace }}.svc.cluster.local:5432/{{ .Values.cluster.namespace }}_usersroles"
          username: {{ .Values.namespaceTag.dataprovider }}_usersroles
          password: vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.namespace }}-postgres-passwords#{{ .Values.cluster.namespace }}-usersroles
        env:
        - name: KAFKA_USERSROLES
          value: "vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.commonToolsNamespace }}-kafka-credentials#{{ .Values.cluster.namespace }}_usersroles"
        # Seeding EDVAL de identity_attribute_roles (templates/users-roles-role-attributes-configmap.yaml).
        # El configmap del chart upstream emite DATABASESEEDING_ROLE_IDENTITY_ATTRIBUTES_MAPPING_*,
        # que NO enlazan con database-seeding.role-attributes-mapping (DBSeedingProperties): sin
        # estas dos entraba el roleAttributes.default.json de SIMPL.
        - name: DATABASESEEDING_ROLEATTRIBUTESMAPPING_ENABLED
          value: "true"
        - name: DATABASESEEDING_ROLEATTRIBUTESMAPPING_FILEPATH
          value: "file:/app/config/roleAttributes.json"
        # volumes/volumeMounts sustituyen la lista del chart: se repite spring-config (/config/).
        volumes:
        - name: spring-config
          configMap:
            name: users-roles-spring-configmap
        - name: role-attributes
          configMap:
            name: users-roles-role-attributes
        volumeMounts:
        - name: spring-config
          mountPath: /config/
        - name: role-attributes
          mountPath: /app/config
          readOnly: true
        appConfig:
          notification:
            role-requests:
              my-profile-url: "https://participant-fe-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/my-profile"
              role-request-review-page: "https://participant-fe-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/role-requests-management/review/{roleRequestId}"
        microservices:
          authenticationProviderUrl: http://authentication-provider.{{ .Values.cluster.namespace }}.svc.cluster.local:8080
        kafkaConfig:
          spring:
            kafka:
              bootstrap-servers: kafka.{{ .Values.cluster.commonToolsNamespace }}.svc.cluster.local:9092
              consumer:
                group-id: users-roles
                # earliest, NO el 'latest' por defecto de Spring. El topic
                # iaa.<ns>....identity-attributes.updated lo AUTOCREA el authentication-provider
                # la primera vez que publica, que es en su chequeo programado, horas despues de que
                # users-roles ya este arrancado y suscrito por patron (inbox.topic.pattern). Cuando
                # el consumidor descubre el topic nuevo no tiene offset comiteado, y con 'latest' se
                # planta al final saltandose el UNICO mensaje que hay. Resultado: identity_attribute_roles
                # se queda entero a enabled=false y el participante no tiene roles, con lag 0 y sin
                # ningun error en ninguna parte. Pasado el 21/08 en prodddl, prodisbl y prodcnie.
                auto-offset-reset: earliest
                properties:
                  security.protocol: SASL_PLAINTEXT
                  sasl.mechanism: PLAIN
