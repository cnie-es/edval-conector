        image:
          registry: ghcr.io/cnie-es
          tag: {{ .Values.imagesTags.simplCatalogueClient }}
        env:
          PUBLIC_AUTH_KEYCLOAK_SERVER_URL: "https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}"
          PUBLIC_FC_DATA_URL: "https://tls-authority-{{ .Values.namespaceTag.authority }}.{{ include "connector.authorityDomain" . }}/fc"
          PUBLIC_SEARCH_API_URL: "https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/xfsc-advsearch-be"
          PUBLIC_CONTRACT_CONSUMPTION_API_URL: "https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/contract-consumption"
        ingress:
          className: apisix
          annotations:
            kubernetes.io/ingress.class: apisix
            {{- if or (.Values.tls).perHost (and (not .Values.embeddedCommon.enabled) (not .Values.wildcardTlsExternal)) }}
            cert-manager.io/cluster-issuer: {{ .Values.cluster.issuer }}
            {{- if not (.Values.tls).perHost }}
            acme.cert-manager.io/http01-edit-in-place: "true"
            {{- end }}
            {{- end }}
            k8s.apisix.apache.org/proxy-body-size: 5m
            k8s.apisix.apache.org/proxy-buffering: "on"
            k8s.apisix.apache.org/proxy-buffer-size: "8k"
          hosts:
            - host: catalogue-ui-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}
              paths:
              - path: /*
                pathType: ImplementationSpecific
          tls:
            - secretName: {{ if (.Values.tls).perHost }}{{ printf "catalogue-ui-%s-tls" .Values.namespaceTag.dataprovider }}{{ else }}{{ .Values.wildcardTlsSecretName | default (printf "catalogue-ui-%s-tls" .Values.namespaceTag.dataprovider) }}{{ end }}
              hosts:
                - catalogue-ui-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.simpl_catalogue_client.resources }}
        resources: {{- toYaml .Values.simpl_catalogue_client.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}
  # Tier 1 Gateway
  # Chart en vendor/ con ingressClassName apisix: el original lo trae fijo a nginx y en los clusters
  # del conector solo hay controlador de APISIX.
  - repoURL: {{ .Values.values.repo_URL }}
    targetRevision: {{ .Values.values.branch }}
    path: vendor/tier1-gateway
    helm:
      valueFiles:
        {{- range .Values.tier1_gateway.valueFiles }}
        - $values/Agents/connector/app-values/tier1-gateway/{{ . }}
        {{- end }}
      values: |
        {{- if $.Values.caTrust.enabled }}
        {{- include "connector.javaTrustValues" (dict "root" $ "chart" "tier1-gateway") | nindent 8 }}
        {{- end }}
        hostT1: participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}
        image:
          registry: ghcr.io/cnie-es
          tag: {{ .Values.imagesTags.tier1Gateway }}
        cors:
          allowOrigin: https://participant-fe-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }},https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }},https://infrastructure-fe-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }},https://data-dashboard-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }},http://localhost:4202,http://localhost:3000
        ingress:
          issuer: {{ .Values.cluster.issuer }}
          {{- if .Values.wildcardTlsSecretName }}
          # SaaS interno y externo: usar el cert wildcard configurado (interno=vallelengua-tls,
          # externo=el del participante). Fijar ingress.tls.secretName omite la anotacion
          # cluster-issuer (el letsencrypt per-host no completa el challenge ACME on-prem ->
          # APISIX no publicaria la ruta -> onboarding 404 Route Not Found).
          tls:
            secretName: {{ .Values.wildcardTlsSecretName }}
          {{- end }}
        keycloakUrl: http://keycloak.{{ .Values.cluster.namespace }}.svc.cluster.local
        usersRolesUrl: http://users-roles.{{ .Values.cluster.namespace }}.svc.cluster.local:8080
        authenticationProviderUrl: http://authentication-provider.{{ .Values.cluster.namespace }}.svc.cluster.local:8080
        appConfig:
          jwt-configuration:
            primary:
              realm: participant
          routes:
            microservices-info:
              microservices:
                - name: users-roles
                  internalUrl: "http://users-roles.{{ .Values.cluster.namespace }}.svc.cluster.local:8080/v1"
                  detailUrl: "https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/userApi/v1/"
                - name: authentication-provider
                  internalUrl: "http://authentication-provider.{{ .Values.cluster.namespace }}.svc.cluster.local:8080/v1"
                  detailUrl: "https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/authApi/v1/"
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.tier1_gateway.resources }}
        resources: {{- toYaml .Values.tier1_gateway.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  # Users Roles
  - repoURL: https://github.com/cnie-es/simpl-users-roles.git
    targetRevision: 2.11.1-edval
    path: charts
    helm:
      valueFiles:
        {{- range .Values.users_roles.valueFiles }}
        - $values/Agents/connector/app-values/Users-Roles/{{ . }}
        {{- end }}
      values: |
        podAnnotations:
          vault.security.banzaicloud.io/vault-addr: "https://secrets-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}"
          {{- with include "connector.vaultCaSecret" $ }}
          vault.security.banzaicloud.io/vault-tls-secret: {{ . }}
          {{- end }}
          vault.security.banzaicloud.io/vault-role: {{ .Values.secrets.role }}
          vault.security.banzaicloud.io/vault-env-image: "ghcr.io/bank-vaults/vault-env:v1.22.1"
        hostT1: participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}
        image:
          repository: "ghcr.io/ednel-rioja/k8s-images/users-roles"
          tag: {{ .Values.imagesTags.usersRoles }}
        authorityHostT2: tls-authority-{{ .Values.namespaceTag.authority }}.{{ include "connector.authorityDomain" . }}
        global:
          ingress:
            issuer: {{ .Values.cluster.issuer }}
        keycloak:
          master:
            password: vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.namespace }}-keycloak#admin
        db:
          url: "jdbc:postgresql://pg-cluster.{{ .Values.cluster.namespace }}.svc.cluster.local:5432/{{ .Values.cluster.namespace }}_usersroles"
          username: {{ .Values.namespaceTag.dataprovider }}_usersroles
          password: vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.namespace }}-postgres-passwords#{{ .Values.cluster.namespace }}-usersroles
        env:
        - name: KAFKA_USERSROLES
          value: "vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.commonToolsNamespace }}-kafka-credentials#{{ .Values.cluster.namespace }}_usersroles"
        appConfig:
          notification:
            role-requests:
              my-profile-url: "https://participant-fe-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/my-profile"
              role-request-review-page: "https://participant-fe-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/role-requests-management/review/{roleRequestId}"
        microservices:
          authenticationProviderUrl: http://authentication-provider.{{ .Values.cluster.namespace }}.svc.cluster.local:8080
        kafkaConfig:
          spring:
            kafka:
              bootstrap-servers: kafka.{{ .Values.cluster.commonToolsNamespace }}.svc.cluster.local:9092
              consumer:
                group-id: users-roles
                # earliest, NO el 'latest' por defecto de Spring. El topic
                # iaa.<ns>....identity-attributes.updated lo AUTOCREA el authentication-provider
                # la primera vez que publica, que es en su chequeo programado, horas despues de que
                # users-roles ya este arrancado y suscrito por patron (inbox.topic.pattern). Cuando
                # el consumidor descubre el topic nuevo no tiene offset comiteado, y con 'latest' se
                # planta al final saltandose el UNICO mensaje que hay. Resultado: identity_attribute_roles
                # se queda entero a enabled=false y el participante no tiene roles, con lag 0 y sin
                # ningun error en ninguna parte. Pasado el 21/08 en prodddl, prodisbl y prodcnie.
                auto-offset-reset: earliest
                properties:
                  security.protocol: SASL_PLAINTEXT
                  sasl.mechanism: PLAIN
                  sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="{{ .Values.cluster.namespace }}_usersroles" password="${KAFKA_USERSROLES}";
              admin:
                auto-create: true
          simpl:
            kafka:
              topic:
                prefix: iaa.{{ .Values.cluster.namespace }}.
              inbox:
                topic:
                  pattern: iaa\.{{ .Values.cluster.namespace }}\..*
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.users_roles.resources }}
        resources: {{- toYaml .Values.users_roles.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  # Users Roles FE
  # Chart en vendor/ con ingressClassName apisix: el original lo trae fijo a nginx y en los clusters
  # del conector solo hay controlador de APISIX.
  - repoURL: {{ .Values.values.repo_URL }}
    targetRevision: {{ .Values.values.branch }}
    path: vendor/fe-users-and-roles
    helm:
      {{- if .Values.users_roles_fe.valueFiles }}
      valueFiles:
        {{- range .Values.users_roles_fe.valueFiles }}
        - $values/Agents/connector/app-values/users-roles-fe/{{ . }}
        {{- end }}
      {{- end }}
      values: |
        hostFe: participant-fe-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}
        ingress:
          issuer: {{ .Values.cluster.issuer }}
          {{- if .Values.wildcardTlsSecretName }}
          # SaaS interno/externo: cert wildcard configurado (interno=vallelengua-tls). Sin esto la
          # ingress FE cae al cert per-host letsencrypt (participant-fe-<ns>...-cert) que NO existe/NO
          # completa el challenge ACME on-prem -> el ingress-controller APISIX FALLA el reconcile TLS
          # ("Secret ...-cert not found") -> NO publica la ruta -> el host participant-fe da 404.
          tls:
            secretName: {{ .Values.wildcardTlsSecretName }}
          {{- end }}
        cors:
          allowOrigin: https://participant-fe-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }},https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }},http://localhost:4202,http://localhost:4203,http://localhost:3000
        image:
          repository: "ghcr.io/ednel-rioja/k8s-images/fe-users-and-roles"
          tag: {{ .Values.imagesTags.usersRolesFe }}
        env:
        - name: API_URL
          value: "https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}"
        - name: KEYCLOAK_URL
          value: "https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/auth"
        - name: KEYCLOAK_REALM
          value: "participant"
        - name: KEYCLOAK_CLIENT_ID
          value: "frontend-cli"
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.users_roles_fe.resources }}
        resources: {{- toYaml .Values.users_roles_fe.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  # Tier 2 Gateway
  # Chart en vendor/ (el publico de code.europa.eu) para poder anotar el Service: el original
  # solo pone las de external-dns, y en EKS el AWS Load Balancer Controller lo crea entonces como
  # NLB INTERNO, con lo que tls-participant no es alcanzable desde fuera de la VPC.
  - repoURL: {{ .Values.values.repo_URL }}
    targetRevision: {{ .Values.values.branch }}
    path: vendor/tier2-gateway
    helm:
      valueFiles:
        {{- range .Values.tier2_gateway.valueFiles }}
        - $values/Agents/connector/app-values/tier2-gateway/{{ . }}
        {{- end }}
      values: |
        podAnnotations:
          vault.security.banzaicloud.io/vault-addr: "https://secrets-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}"
          {{- with include "connector.vaultCaSecret" $ }}
          vault.security.banzaicloud.io/vault-tls-secret: {{ . }}
          {{- end }}
          vault.security.banzaicloud.io/vault-role: {{ .Values.secrets.role }}
          vault.security.banzaicloud.io/vault-env-image: "ghcr.io/bank-vaults/vault-env:v1.22.1"
          # Reinicia este pod cuando rote la password de Redis; ver connector.redisSecretChecksum.
          checksum/redis-secret: {{ include "connector.redisSecretChecksum" $ }}
        image:
          registry: ghcr.io/cnie-es
          tag: {{ .Values.imagesTags.tier2Gateway }}
        env:
        - name: KAFKA_TIER2GW
          value: "vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.commonToolsNamespace }}-kafka-credentials#{{ .Values.cluster.namespace }}_tier2gw"
        - name: SPRING_DATA_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secrets
              key: redis
        cors:
          allowOrigin: https://authority-fe-{{ .Values.namespaceTag.authority }}.{{ include "connector.authorityDomain" . }},https://authority-be-{{ .Values.namespaceTag.authority }}.{{ include "connector.authorityDomain" . }},https://data-dashboard-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }},http://localhost:4202,http://localhost:3000
        kafka:
          bootstrap-servers: kafka.{{ .Values.cluster.commonToolsNamespace }}.svc.cluster.local:9092
        redis:
          host: "redis-master.{{ .Values.cluster.namespace }}.svc.cluster.local"
        hostT2: "tls-participant-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}"
        {{- with .Values.lbNetwork }}
        {{- if ne . "public" }}
        lbNetwork: {{ . }}
        {{- end }}
        {{- end }}
        {{- if eq .Values.lbNetwork "cloud" }}
        # Cloud (EKS): NLB publico. Sin esta anotacion el AWS Load Balancer Controller lo crea
        # interno y tls-participant resuelve a una IP privada de la VPC.
        service:
          annotations:
            service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
        {{- end }}
        {{- if $.Values.caTrust.enabled }}
        {{- include "connector.javaTrustValues" (dict "root" $ "chart" "tier2-gateway") | nindent 8 }}
        {{- end }}
        authorityUrlT1: "https://authority-be-{{ .Values.namespaceTag.authority }}.{{ include "connector.authorityDomain" . }}"
        kafkaConfig:
          spring:
            kafka:
              bootstrap-servers: kafka.{{ .Values.cluster.commonToolsNamespace }}.svc.cluster.local:9092
              consumer:
                properties:
                  security.protocol: SASL_PLAINTEXT
                  sasl.mechanism: PLAIN
                  sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="{{ .Values.cluster.namespace }}_tier2gw" password="${KAFKA_TIER2GW}";
              admin:
                auto-create: true
          simpl:
            kafka:
              topic:
                prefix: iaa.{{ .Values.cluster.namespace }}.
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.tier2_gateway.resources }}
        resources: {{- toYaml .Values.tier2_gateway.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  # Tier 2 Proxy
  - repoURL: https://code.europa.eu/api/v4/projects/1112/packages/helm/stable
    targetRevision: 1.7.0-rc.490
    chart: tier2-proxy
    helm:
      {{- if .Values.tier2_proxy.valueFiles }}
      valueFiles:
        {{- range .Values.tier2_proxy.valueFiles }}
        - $values/Agents/connector/app-values/tier2-proxy/{{ . }}
        {{- end }}
      {{- end }}
      values: |
        image:
          registry: ghcr.io/cnie-es
          tag: {{ .Values.imagesTags.tier2Proxy }}
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.tier2_proxy.resources }}
        resources: {{- toYaml .Values.tier2_proxy.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  # Authentication Provider
  - repoURL: https://code.europa.eu/api/v4/projects/2223/packages/helm/stable
    targetRevision: 3.0.3
    chart: authentication-provider-be
    helm:
      valueFiles:
        {{- range .Values.auth_provider.valueFiles }}
        - $values/Agents/connector/app-values/auth-provider/{{ . }}
        {{- end }}
      values: |
        {{- if $.Values.caTrust.enabled }}
        {{- include "connector.javaTrustValues" (dict "root" $ "chart" "authentication-provider-be") | nindent 8 }}
        {{- end }}
        podAnnotations:
          vault.security.banzaicloud.io/vault-addr: "https://secrets-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}"
          {{- with include "connector.vaultCaSecret" $ }}
          vault.security.banzaicloud.io/vault-tls-secret: {{ . }}
          {{- end }}
          vault.security.banzaicloud.io/vault-role: {{ .Values.secrets.role }}
          vault.security.banzaicloud.io/vault-env-image: "ghcr.io/bank-vaults/vault-env:v1.22.1"
          # Reinicia este pod cuando rote la password de Redis; ver connector.redisSecretChecksum.
          checksum/redis-secret: {{ include "connector.redisSecretChecksum" $ }}
        image:
          registry: ghcr.io/cnie-es
          tag: {{ .Values.imagesTags.authenticationProvider }}
        appConfig:
          openid-connect:
            certsEndpoint: "https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/auth/realms/participant/protocol/openid-connect/certs"
            certs-endpoint: "https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/auth/realms/participant/protocol/openid-connect/certs"
          management:
            tracing:
              sampling:
                probability: 0.1
            otlp:
              tracing:
                endpoint: http://collector-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}
          spring:
            datasource:
              url: "jdbc:postgresql://pg-cluster.{{ .Values.cluster.namespace }}.svc.cluster.local:5432/{{ .Values.cluster.namespace }}_authenticationprovider"
              username: {{ .Values.namespaceTag.dataprovider }}_authenticationprovider
            data:
              redis:
                host: "redis-master.{{ .Values.cluster.namespace }}.svc.cluster.local"
          microservice:
            identity-provider:
              url: http://identity-provider.{{ .Values.cluster.namespace }}.svc.cluster.local:8080
          client:
            authority:
              url: "https://tls-authority-{{ .Values.namespaceTag.authority }}.{{ include "connector.authorityDomain" . }}"
          simpl:
            certificate:
              san: "tls-participant-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}"
            gateway:
              tier-one-url: "https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}"
              tier-two-url: "https://tls-participant-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}"
        env:
        - name: KAFKA_AUTHPROVIDER
          value: "vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.commonToolsNamespace }}-kafka-credentials#{{ .Values.cluster.namespace }}_authprovider"
        - name: SPRING_DATA_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secrets
              key: redis
        - name: SPRING_DATASOURCE_PASSWORD
          value: "vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.namespace }}-postgres-passwords#{{ .Values.cluster.namespace }}-authenticationprovider"
        kafkaConfig:
          spring:
            kafka:
              bootstrap-servers: kafka.{{ .Values.cluster.commonToolsNamespace }}.svc.cluster.local:9092
              producer:
                properties:
                  security.protocol: SASL_PLAINTEXT
                  sasl.mechanism: PLAIN
                  sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="{{ .Values.cluster.namespace }}_authprovider" password="${KAFKA_AUTHPROVIDER}";
              admin:
                auto-create: true
          simpl:
            kafka:
              topic:
                prefix: iaa.{{ .Values.cluster.namespace }}.
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.auth_provider.resources }}
        resources: {{- toYaml .Values.auth_provider.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  # Authentication Provider FE
  # Chart en vendor/ con ingressClassName apisix: el original lo trae fijo a nginx y en los clusters
  # del conector solo hay controlador de APISIX.
  - repoURL: {{ .Values.values.repo_URL }}
    targetRevision: {{ .Values.values.branch }}
    path: vendor/fe-authentication-provider
    helm:
      {{- if .Values.auth_provider_fe.valueFiles }}
      valueFiles:
        {{- range .Values.auth_provider_fe.valueFiles }}
        - $values/Agents/connector/app-values/auth-provider-fe/{{ . }}
        {{- end }}
      {{- end }}
      values: |
        hostFe: participant-fe-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}
        ingress:
          issuer: {{ .Values.cluster.issuer }}
          {{- if .Values.wildcardTlsSecretName }}
          # SaaS interno/externo: cert wildcard configurado (interno=vallelengua-tls). Sin esto la
          # ingress FE cae al cert per-host letsencrypt (participant-fe-<ns>...-cert) que NO existe/NO
          # completa el challenge ACME on-prem -> el ingress-controller APISIX FALLA el reconcile TLS
          # ("Secret ...-cert not found") -> NO publica la ruta -> el host participant-fe da 404.
          tls:
            secretName: {{ .Values.wildcardTlsSecretName }}
          {{- end }}
        cors:
          allowOrigin: https://participant-fe-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }},https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }},http://localhost:4202,http://localhost:4203,http://localhost:3000
        image:
          repository: "ghcr.io/ednel-rioja/k8s-images/fe-authentication-provider"
          tag: {{ .Values.imagesTags.feAuthenticationProvider }}
        env:
        - name: API_URL
          value: "https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}"
        - name: KEYCLOAK_URL
          value: "https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/auth"
        - name: KEYCLOAK_REALM
          value: "participant"
        - name: KEYCLOAK_CLIENT_ID
          value: "frontend-cli"
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.auth_provider_fe.resources }}
        resources: {{- toYaml .Values.auth_provider_fe.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- if .Values.sd_ui.enabled }}
  # SD UI
  - repoURL: https://code.europa.eu/api/v4/projects/923/packages/helm/stable
    targetRevision: 1.16.0
    chart: sd-ui
    helm:
      valueFiles:
        {{- range .Values.sd_ui.valueFiles }}
        - $values/Agents/connector/app-values/simpl-sd-ui/{{ . }}
        {{- end }}
      values: |
        image:
          registry: ghcr.io/cnie-es
          tag: {{ .Values.imagesTags.sdUi }}
        ingress:
          className: apisix
          annotations:
            kubernetes.io/ingress.class: apisix
            {{- if or (.Values.tls).perHost (and (not .Values.embeddedCommon.enabled) (not .Values.wildcardTlsExternal)) }}
            cert-manager.io/cluster-issuer: {{ .Values.cluster.issuer }}
            {{- if not (.Values.tls).perHost }}
            acme.cert-manager.io/http01-edit-in-place: "true"
            {{- end }}
            {{- end }}
            k8s.apisix.apache.org/proxy-body-size: 5m
            k8s.apisix.apache.org/proxy-buffering: "on"
            k8s.apisix.apache.org/proxy-buffer-size: "8k"
          hosts:
            - host: sd-ui-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}
              paths:
              - path: /*
                pathType: ImplementationSpecific
          tls:
            - secretName: {{ if (.Values.tls).perHost }}{{ printf "sd-ui-%s-tls" .Values.namespaceTag.dataprovider }}{{ else }}{{ .Values.wildcardTlsSecretName | default (printf "sd-ui-%s-tls" .Values.namespaceTag.dataprovider) }}{{ end }}
              hosts:
                - sd-ui-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}
        env:
          PUBLIC_AUTH_KEYCLOAK_SERVER_URL: "https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}"
          PUBLIC_CREATION_WIZARD_API_URL: "https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/sdtooling-api"
          PUBLIC_SIGNER_URL: "https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/signer"
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.sd_ui.resources }}
        resources: {{- toYaml .Values.sd_ui.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}
  {{- if .Values.data_dashboard.enabled }}
  # Data Dashboard
  # cnie-es/edc-data-dashboard es el codigo de la app y no trae chart de Helm; el chart va en
  # vendor/data-dashboard (copiado de external/data-dashboard de simpl-participant-connector).
  - repoURL: {{ .Values.values.repo_URL }}
    targetRevision: {{ .Values.values.branch }}
    path: vendor/data-dashboard
    helm:
      valueFiles:
        {{- range .Values.data_dashboard.valueFiles }}
        - $values/Agents/connector/app-values/data-dashboard/{{ . }}
        {{- end }}
      values: |
        fullnameOverride: {{ .Values.data_dashboard.nameOverride }}
        image:
          repository: "ghcr.io/ednel-rioja/k8s-images/datadashboard"
          tag: {{ .Values.imagesTags.dataDashboard }}
        ingress:
          enabled: true
          className: apisix
          annotations:
            kubernetes.io/ingress.class: apisix
            {{- if or (.Values.tls).perHost (and (not .Values.embeddedCommon.enabled) (not .Values.wildcardTlsExternal)) }}
            cert-manager.io/cluster-issuer: {{ .Values.cluster.issuer }}
            {{- if not (.Values.tls).perHost }}
            acme.cert-manager.io/http01-edit-in-place: "true"
            {{- end }}
            {{- end }}
            k8s.apisix.apache.org/proxy-body-size: "5m"
            k8s.apisix.apache.org/proxy-buffer-size: "8k"
            k8s.apisix.apache.org/proxy-buffering: "on"
          hosts:
            - host: data-dashboard-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: {{ if (.Values.tls).perHost }}{{ printf "data-dashboard-%s-tls" .Values.namespaceTag.dataprovider }}{{ else }}{{ .Values.wildcardTlsSecretName | default (printf "data-dashboard-%s-tls" .Values.namespaceTag.dataprovider) }}{{ end }}
              hosts:
                - data-dashboard-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}
        config:
          runtimeConfigInjection: true
          authMode: keycloak
          keycloak:
            url: "https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/auth"
            realm: "participant"
            clientId: "data-dashboard"
            onLoad: "login-required"
            checkLoginIframe: false
          edc:
            connectorName: "{{ .Values.cluster.namespace }}"
            managementUrl: "https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/edc/management"
            defaultUrl: "https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/edc/management"
            protocolUrl: "https://tls-participant-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/edc/api/v1/dsp"
            xfscAdvSearchBaseUrl: "https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/xfsc-advsearch-be/v1"
            dashboardApiBaseUrl: "https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/datadashboardApi"
            contractConsumptionApiBaseUrl: "https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/contract-consumption"
            contractConsumptionApiVersion: "v1"
            sdToolingBaseUrl: "https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/sdtooling-api/v2"
            federatedCatalogEnabled: false
            did: "did:web:tls-participant-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}"
            signerApiBaseUrl: "https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/signer"
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.data_dashboard.resources }}
        resources: {{- toYaml .Values.data_dashboard.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}
  {{- if .Values.simpl_edc.enabled }}
  # Simpl EDC
  - repoURL: https://github.com/cnie-es/simpl-edc.git
    targetRevision: 1.0.21-edval
    path: charts
    helm:
      releaseName: {{ .Values.simpl_edc.nameOverride }}
      valueFiles:
        {{- range .Values.simpl_edc.valueFiles }}
        - $values/Agents/connector/app-values/simpl-edc/{{ . }}
        {{- end }}
      values: |
        deployment:
          image: {{ .Values.images.simplEdc }}
          tag: {{ .Values.imagesTags.simplEdc }}
          host: {{ .Values.simpl_edc.nameOverride }}-service
          callbackAddress: "https://tls-participant-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/edc"
        env:
          datasourceurl: "jdbc:postgresql://pg-cluster.{{ .Values.cluster.namespace }}.svc.cluster.local:5432/{{ .Values.cluster.namespace }}_edc"
          edcParticipantId: {{ .Values.cluster.namespace }}
        postgresql:
          username: {{ .Values.cluster.namespace }}_edc
        # El chart cnie-es/simpl-edc comprueba tls.url.participantIdSource pero el curl de su init
        # wait-for-participant-id usa tls.participantIdSource: sin esta clave el init llama a curl sin
        # URL ("no URL specified") y el EDC no arranca nunca.
        tls:
          participantIdSource: http://authentication-provider:8080/v1/credentials
        hashicorp:
          {{- with include "connector.vaultCaSecret" $ }}
          tlsSecret: {{ . }}
          {{- end }}
          role: {{ .Values.secrets.role }}
          service: "https://secrets-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}"
        secretEngine: {{ .Values.secrets.secretEngine }}
        ingress:
          corsAllowOrigin: "*"
          publicEndpoint:
            enabled: true
            host: public-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}
            clusterIssuer: {{ .Values.cluster.issuer }}
            tlsSecretName: public-be-{{ .Values.namespaceTag.dataprovider }}-tls
            baseUrl: "https://public-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/public"
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.simpl_edc.resources }}
        resources: {{- toYaml .Values.simpl_edc.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}
  {{- if .Values.simpl_edc_consumer.enabled }}
  # Simpl EDC (perfil consumer) - 2a instancia para el Agente hibrido.
  # Service simpl-edc-consumer-service (29xxx); DB propia <ns>_edc_consumer; mismo participante.
  - repoURL: https://github.com/cnie-es/simpl-edc.git
    targetRevision: 1.0.21-edval
    path: charts
    helm:
      releaseName: {{ .Values.simpl_edc_consumer.nameOverride }}
      valueFiles:
        {{- range .Values.simpl_edc_consumer.valueFiles }}
        - $values/Agents/connector/app-values/simpl-edc-consumer/{{ . }}
        {{- end }}
      values: |
        deployment:
          image: {{ .Values.images.simplEdc }}
          tag: {{ .Values.imagesTags.simplEdc }}
          host: {{ .Values.simpl_edc_consumer.nameOverride }}-service
          callbackAddress: "https://tls-participant-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/edc"
        env:
          datasourceurl: "jdbc:postgresql://pg-cluster.{{ .Values.cluster.namespace }}.svc.cluster.local:5432/{{ .Values.cluster.namespace }}_edc_consumer"
          edcParticipantId: {{ .Values.cluster.namespace }}
        postgresql:
          username: {{ .Values.cluster.namespace }}_edc_consumer
        # El chart cnie-es/simpl-edc comprueba tls.url.participantIdSource pero el curl de su init
        # wait-for-participant-id usa tls.participantIdSource: sin esta clave el init llama a curl sin
        # URL ("no URL specified") y el EDC no arranca nunca.
        tls:
          participantIdSource: http://authentication-provider:8080/v1/credentials
        hashicorp:
          {{- with include "connector.vaultCaSecret" $ }}
          tlsSecret: {{ . }}
          {{- end }}
          role: {{ .Values.secrets.role }}
          service: "https://secrets-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}"
        secretEngine: {{ .Values.secrets.secretEngine }}
        ingress:
          corsAllowOrigin: "*"
          # publicEndpoint deshabilitado: la instancia provider ya expone public-be-<ns>;
          # habilitar aqui colisionaria en el mismo host/ingress.
          publicEndpoint:
            enabled: false
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.simpl_edc_consumer.resources }}
        resources: {{- toYaml .Values.simpl_edc_consumer.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}
  {{- if .Values.edc_connector_adapter.enabled }}
  # EDC Connector Adapter
  - repoURL: https://github.com/cnie-es/simpl-edc-connector-adapter.git
    targetRevision: 1.14.0-edval
    path: charts
    helm:
      releaseName: {{ .Values.edc_connector_adapter.nameOverride }}
      valueFiles:
        {{- range .Values.edc_connector_adapter.valueFiles }}
        - $values/Agents/connector/app-values/edc-connector-adapter/{{ . }}
        {{- end }}
      values: |
        image:
          repository: "ghcr.io/ednel-rioja/k8s-images/data1-edcconnectoradapter"
          tag: {{ .Values.imagesTags.edcConnectorAdapter | quote }}
        domain: {{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}
        ingress:
          clusterIssuer: {{ .Values.cluster.issuer }}
        openapiConfig:
          servers: https://edc-connector-adapter-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}
        openTelemetry:
          otlpExporter:
            endpoint: http://collector-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}
        edcConnector:
          tier2BaseUrl: https://tls-participant-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/edc
          participantId: {{ .Values.cluster.namespace }}
          # Con participantIdSource, un init container resuelve el participantId canonico (UUID)
          # desde el authentication-provider y lo exporta como EDC_CONNECTOR_PARTICIPANT_ID,
          # ignorando participantId (= namespace). Debe coincidir con edc.participant.id del
          # conector simpl-edc para que el assigner de la policy case en la contratacion.
          participantIdSource: "http://authentication-provider:8080/v1/credentials"
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.edc_connector_adapter.resources }}
        resources: {{- toYaml .Values.edc_connector_adapter.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}
  {{- if .Values.edc_connector_adapter_consumer.enabled }}
  # EDC Connector Adapter (perfil consumer) - 2a instancia para el Agente hibrido.
  # Publica los topics contract_consumption.* que consume contract-consumption-be.
  - repoURL: https://github.com/cnie-es/simpl-edc-connector-adapter.git
    targetRevision: 1.14.0-edval
    path: charts
    targetRevision: {{ .Values.chartRevisions.edcConnectorAdapter }}
    helm:
      releaseName: {{ .Values.edc_connector_adapter_consumer.nameOverride }}
      valueFiles:
        {{- range .Values.edc_connector_adapter_consumer.valueFiles }}
        - $values/Agents/connector/app-values/edc-connector-adapter-consumer/{{ . }}
        {{- end }}
      values: |
        image:
          repository: "ghcr.io/ednel-rioja/k8s-images/data1-edcconnectoradapter"
          tag: {{ .Values.imagesTags.edcConnectorAdapter | quote }}
        ingress:
          clusterIssuer: {{ .Values.cluster.issuer }}
        domain: {{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}
        openapiConfig:
          servers: https://edc-connector-adapter-consumer-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}
        openTelemetry:
          otlpExporter:
            endpoint: http://collector-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}

        profile: consumer
        appJarPath: "/home/simpluser/app.jar"
        {{- if not .Values.embeddedCommon.enabled }}
        # Solo participantes INTERNOS/core: el authentication-provider vive en el namespace del
        # participante, dentro del cluster del core. En un externo (self-hosted, values-external.yaml)
        # no se inyecta y el chart no renderiza la variable.
        participantAuthApiBaseUrl: "http://authentication-provider.{{ .Values.cluster.namespace }}.svc.cluster.local:8080"
        {{- end }}

        edcConnector:
          # apiKey real viene de OpenBao via /vault/secrets/config.txt (source en el command).
          # Aqui un placeholder para no disparar el mutating webhook de bank-vaults.
          # Apunta al conector HIBRIDO unico (management :19193); antes, instancia consumer 29xxx.
          baseUrl: http://simpl-edc-service:19193
          apiKey: "placeholder-overridden-by-vault-agent"
          participantId: {{ .Values.cluster.namespace }}
          tier2BaseUrl: https://tls-participant-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/edc
          # Con participantIdSource, un init container resuelve el participantId canonico (UUID)
          # desde el authentication-provider y lo exporta como EDC_CONNECTOR_PARTICIPANT_ID.
          # Debe coincidir con edc.participant.id del conector simpl-edc para que el assigner
          # de la policy case en la contratacion.
          participantIdSource: "http://authentication-provider:8080/v1/credentials"

        kafka:
          bootstrapServers: kafka.{{ .Values.cluster.commonToolsNamespace }}.svc.cluster.local:9092
          consumer:
            groupId: contract_consumption
          topics:
            transferStatus: contract_consumption.transfer_status-{{ .Values.cluster.namespace }}
            transferDeprovisioning: contract_consumption.transfer_deprovisioning-{{ .Values.cluster.namespace }}
            transferRecord: contract_consumption.transfer_record-{{ .Values.cluster.namespace }}
            contractRecord: contract_consumption.contract_record-{{ .Values.cluster.namespace }}
          auth:
            type: SASL_PLAINTEXT
          fatalIfBrokerNotAvailable: false

        cluster:
          namespace: {{ .Values.cluster.namespace }}

        vault:
          secretEngine: {{ .Values.secrets.secretEngine }}
          secretPath: "{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.namespace }}-edc-connector-adapter-consumer"
          role: {{ .Values.secrets.role }}
          service: "https://secrets-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}"
        {{- with include "connector.vaultCaSecret" $ }}
          tlsSecret: {{ . }}
        {{- end }}
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.edc_connector_adapter_consumer.resources }}
        resources: {{- toYaml .Values.edc_connector_adapter_consumer.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}
  {{- if .Values.monitoring.enabled }}
  # Monitoring
  - repoURL: https://code.europa.eu/api/v4/projects/828/packages/helm/stable
    targetRevision: 0.10.0
    chart: eck-monitoring
    helm:
      releaseName: {{ .Values.monitoring.fullnameOverride }}
      valueFiles:
        {{- range .Values.monitoring.valueFiles }}
        - $values/Agents/connector/app-values/monitoring/{{ . }}
        {{- end }}
      values: |
        clusterIssuer: {{ .Values.cluster.issuer }}
        domainSuffix: {{ .Values.domainSuffix }}
        creimage:
          tag: {{ .Values.imagesTags.monitoring }}
        namespaceTag: {{ .Values.namespaceTag.dataprovider }}
        # mainNamespace must be the common namespace where the elastic stack
        # lives (filebeat/metricbeat ship there). The eck-monitoring chart
        # gates `logstash_mon.yaml` with `if eq namespaceTag mainNamespace`,
        # so they must be DIFFERENT in participant deployments — otherwise
        # the chart tries to render the central logstash monitor pod here
        # and explodes on `nil pointer .Values.logstash.mon.pipelines`
        # (that subtree only exists in the common-side values, not in the
        # participant override). cluster.commonToolsNamespace is set by the
        # participant-apps chart to the common namespace (e.g. "intcommon").
        mainNamespace: {{ .Values.namespaceTag.common | default .Values.cluster.commonToolsNamespace }}
        filebeat:
          {{- if eq .Values.resourcePreset "low" }}
          resources:
            requests:
              cpu: "0"
              memory: "0"
          {{- else }}
            {{- if .Values.monitoring.resources.filebeat }}
          resources: {{- toYaml .Values.monitoring.resources.filebeat | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if .Values.nodeSelector }}
          nodeSelector: {{- toYaml .Values.nodeSelector | nindent 12 }}
          {{- end }}
          {{- if .Values.nodeSelector }}
        metricbeat:
          nodeSelector: {{- toYaml .Values.nodeSelector | nindent 12 }}
          {{- end }}
  {{- end }}
  # Contract
  - repoURL: https://github.com/cnie-es/simpl-contract.git
