            topics:
              signContractRequest: sign-contract-req-{{ .Values.cluster.namespace }}
              signContractRequestDLT: sign-contract-req-dlt-{{ .Values.cluster.namespace }}
              signContractResponse: sign-contract-resp-{{ .Values.cluster.namespace }}
              signContractResponseDLT: sign-contract-resp-dlt-{{ .Values.cluster.namespace }}
              statusUpdate: status-update-{{ .Values.cluster.namespace }}
              statusUpdateDLT: status-update-dlt-{{ .Values.cluster.namespace }}
              searchContractRequest: search-contract-req-{{ .Values.cluster.namespace }}
              searchContractRequestDLT: search-contract-req-dlt-{{ .Values.cluster.namespace }}
              searchContractResponse: search-contract-resp-{{ .Values.cluster.namespace }}
              searchContractResponseDLT: search-contract-resp-dlt-{{ .Values.cluster.namespace }}
              createContractRequest: create-contract-req-{{ .Values.cluster.namespace }}
              createContractRequestDLT: create-contract-req-dlt-{{ .Values.cluster.namespace }}
              createContractResponse: create-contract-resp-{{ .Values.cluster.namespace }}
              createContractResponseDLT: create-contract-resp-dlt-{{ .Values.cluster.namespace }}
          urls:
            catalogSearch: "https://tls-authority-{{ .Values.namespaceTag.authority }}.{{ include "connector.authorityDomain" . }}/adapter"
            catalogGet: "https://tls-authority-{{ .Values.namespaceTag.authority }}.{{ include "connector.authorityDomain" . }}/fc"
          otel:
            endpoint: http://collector-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}
          vault:
            hashicorp:
              {{- with include "connector.vaultCaSecret" $ }}
              tlsSecret: {{ . }}
              {{- end }}
              service: "https://secrets-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}"
              secretEngine: {{ .Values.secrets.secretEngine }}
              role: {{ .Values.secrets.role }}
              secretConfigPath: "{{ .Values.secrets.secretEngine }}/{{ .Values.cluster.namespace }}-contract-consumer"
        {{- if eq .Values.resourcePreset "low" }}
