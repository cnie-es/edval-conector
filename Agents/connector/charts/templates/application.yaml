  # Tier 2 Gateway
  # Chart en vendor/ (el publico de code.europa.eu) para poder anotar el Service: el original
  # solo pone las de external-dns, y en EKS el AWS Load Balancer Controller lo crea entonces como
  # NLB INTERNO, con lo que tls-participant no es alcanzable desde fuera de la VPC.
  - repoURL: {{ .Values.values.repo_URL }}
    targetRevision: {{ .Values.values.branch }}
    path: vendor/tier2-gateway
    helm:
      valueFiles:
        {{- range .Values.tier2_gateway.valueFiles }}
        - $values/Agents/connector/app-values/tier2-gateway/{{ . }}
        {{- end }}
      values: |
        podAnnotations:
          vault.security.banzaicloud.io/vault-addr: "https://secrets-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}"
          {{- with include "connector.vaultCaSecret" $ }}
          vault.security.banzaicloud.io/vault-tls-secret: {{ . }}
          {{- end }}
          vault.security.banzaicloud.io/vault-role: {{ .Values.secrets.role }}
          vault.security.banzaicloud.io/vault-env-image: "ghcr.io/bank-vaults/vault-env:v1.22.1"
          # Reinicia este pod cuando rote la password de Redis; ver connector.redisSecretChecksum.
          checksum/redis-secret: {{ include "connector.redisSecretChecksum" $ }}
        image:
          registry: ghcr.io/cnie-es
          tag: {{ .Values.imagesTags.tier2Gateway }}
        env:
        - name: KAFKA_TIER2GW
          value: "vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.commonToolsNamespace }}-kafka-credentials#{{ .Values.cluster.namespace }}_tier2gw"
        - name: SPRING_DATA_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secrets
              key: redis
        cors:
          allowOrigin: https://authority-fe-{{ .Values.namespaceTag.authority }}.{{ include "connector.authorityDomain" . }},https://authority-be-{{ .Values.namespaceTag.authority }}.{{ include "connector.authorityDomain" . }},https://data-dashboard-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }},http://localhost:4202,http://localhost:3000
        kafka:
          bootstrap-servers: kafka.{{ .Values.cluster.commonToolsNamespace }}.svc.cluster.local:9092
        redis:
          host: "redis-master.{{ .Values.cluster.namespace }}.svc.cluster.local"
        hostT2: "tls-participant-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}"
        {{- with .Values.lbNetwork }}
        {{- if ne . "public" }}
        lbNetwork: {{ . }}
        {{- end }}
        {{- end }}
        {{- if eq .Values.lbNetwork "cloud" }}
        # Cloud (EKS): NLB publico. Sin esta anotacion el AWS Load Balancer Controller lo crea
        # interno y tls-participant resuelve a una IP privada de la VPC.
        service:
          annotations:
            service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
        {{- end }}
        {{- if $.Values.caTrust.enabled }}
        {{- include "connector.javaTrustValues" (dict "root" $ "chart" "tier2-gateway") | nindent 8 }}
        {{- end }}
        authorityUrlT1: "https://authority-be-{{ .Values.namespaceTag.authority }}.{{ include "connector.authorityDomain" . }}"
        kafkaConfig:
          spring:
            kafka:
              bootstrap-servers: kafka.{{ .Values.cluster.commonToolsNamespace }}.svc.cluster.local:9092
              consumer:
                properties:
                  security.protocol: SASL_PLAINTEXT
                  sasl.mechanism: PLAIN
                  sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="{{ .Values.cluster.namespace }}_tier2gw" password="${KAFKA_TIER2GW}";
              admin:
                auto-create: true
          simpl:
            kafka:
              topic:
                prefix: iaa.{{ .Values.cluster.namespace }}.
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.tier2_gateway.resources }}
        resources: {{- toYaml .Values.tier2_gateway.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  # Tier 2 Proxy
  - repoURL: https://code.europa.eu/api/v4/projects/1112/packages/helm/stable
    targetRevision: 1.7.0-rc.490
    chart: tier2-proxy
    helm:
      {{- if .Values.tier2_proxy.valueFiles }}
      valueFiles:
        {{- range .Values.tier2_proxy.valueFiles }}
        - $values/Agents/connector/app-values/tier2-proxy/{{ . }}
        {{- end }}
      {{- end }}
      values: |
        # El chart oficial (1.7.0-rc.490) despliega el proxy como StatefulSet, pero su HPA apunta a
        # un Deployment del mismo nombre que no existe: FailedGetScale y la Application principal
        # queda Degraded aunque el proxy este sano. Con min=max=1 el HPA no aporta nada.
        autoscaling:
          enabled: false
        image:
          registry: ghcr.io/cnie-es
          tag: {{ .Values.imagesTags.tier2Proxy }}
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.tier2_proxy.resources }}
        resources: {{- toYaml .Values.tier2_proxy.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  # Authentication Provider
  - repoURL: https://code.europa.eu/api/v4/projects/2223/packages/helm/stable
    targetRevision: 3.0.3
    chart: authentication-provider-be
    helm:
      valueFiles:
        {{- range .Values.auth_provider.valueFiles }}
        - $values/Agents/connector/app-values/auth-provider/{{ . }}
        {{- end }}
      values: |
        {{- if $.Values.caTrust.enabled }}
