            host: public-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}
            clusterIssuer: {{ .Values.cluster.issuer }}
            tlsSecretName: public-be-{{ .Values.namespaceTag.dataprovider }}-tls
            baseUrl: "https://public-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/public"
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.simpl_edc.resources }}
        resources: {{- toYaml .Values.simpl_edc.resources | nindent 10 }}
          {{- end }}
        {{- end }}
