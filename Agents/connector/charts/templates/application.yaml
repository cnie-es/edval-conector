          annotations:
            cert-manager.io/cluster-issuer: {{ .Values.cluster.issuer }}
        # El chart (code.europa.eu/.../signer) NO lee hashicorp.*/secretEngine/secretConfigPath
        # (esas claves no existen en su schema) -- las ignora en silencio y su init container
        # cae al default hardcodeado del chart (un Vault de sandbox de SIMPL-open ajeno,
        # sandbox-cat-dat, "namespace not authorized"). Claves reales confirmadas en su
        # values.yaml publicado: vault.address/role/secretPath. Visto en vivo en
        # extletest/eks-external-rioja.
        vault:
          address: "https://secrets-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}"
