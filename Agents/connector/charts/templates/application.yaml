            - secretName: {{ if (.Values.tls).perHost }}{{ printf "data-dashboard-%s-tls" .Values.namespaceTag.dataprovider }}{{ else }}{{ .Values.wildcardTlsSecretName | default (printf "data-dashboard-%s-tls" .Values.namespaceTag.dataprovider) }}{{ end }}
              hosts:
                - data-dashboard-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}
        config:
          runtimeConfigInjection: true
          authMode: keycloak
          keycloak:
            url: "https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/auth"
            realm: "participant"
            clientId: "data-dashboard"
            onLoad: "login-required"
            checkLoginIframe: false
          edc:
            connectorName: "{{ .Values.cluster.namespace }}"
            managementUrl: "https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/edc/management"
            defaultUrl: "https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/edc/management"
            protocolUrl: "https://tls-participant-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/edc/api/v1/dsp"
            xfscAdvSearchBaseUrl: "https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/xfsc-advsearch-be/v1"
            dashboardApiBaseUrl: "https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/datadashboardApi"
            contractConsumptionApiBaseUrl: "https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/contract-consumption"
            contractConsumptionApiVersion: "v1"
            sdToolingBaseUrl: "https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/sdtooling-api/v2"
            federatedCatalogEnabled: false
            did: "did:web:tls-participant-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}"
            signerApiBaseUrl: "https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/signer"
