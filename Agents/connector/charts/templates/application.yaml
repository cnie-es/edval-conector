            user: {{ .Values.cluster.namespace }}_contract_consumer
          kafka:
            bootstrapServer: http://kafka.{{ .Values.cluster.commonToolsNamespace }}.svc.cluster.local:9092
            clientUser: {{ .Values.cluster.namespace }}_contract_consumer
