            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.contract_consumer.resources }}
        resources: {{- toYaml .Values.contract_consumer.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}
  # Stubs
  - repoURL: https://code.europa.eu/api/v4/projects/2052/packages/helm/stable
    targetRevision: 2.9.0
    chart: simpl-stubs
    helm:
      valueFiles:
        {{- range .Values.stubs.valueFiles }}
        - $values/Agents/connector/app-values/stubs/{{ . }}
        {{- end }}
      values: |
        image:
          registry: ghcr.io/cnie-es
          tag: {{ .Values.imagesTags.stubs }}
  {{- if .Values.files.enabled }}
  # Files
  # Chart en vendor/simpl-files (el publico de code.europa.eu, con el arreglo dentro en vez de un parche en vivo).
  - repoURL: {{ .Values.values.repo_URL }}
    targetRevision: {{ .Values.values.branch }}
    path: vendor/simpl-files
    helm:
      valueFiles:
        {{- range .Values.files.valueFiles }}
        - $values/Agents/connector/app-values/files/{{ . }}
        {{- end }}
      values: |
        image:
          registry: ghcr.io/cnie-es
          tag: {{ .Values.imagesTags.simplFiles }}
        ingress:
          # El chart trae nginx por defecto; aqui el unico controlador es APISIX.
          ingressClass: apisix
          hostname: files-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}
          secretName: files-{{ .Values.namespaceTag.dataprovider }}-tls
          clusterIssuer: {{ .Values.cluster.issuer }}
          {{- if .Values.wildcardTlsSecretName }}
          # SaaS interno y externo: cert wildcard configurado. El flujo enriched del sd-tooling
          # descarga las plantillas de contrato de files-<ns> por HTTPS; con self-signed el JDK
          # falla (Failed to parse server certificates). Fijar tls.secretName omite cert-manager.
          tls:
            secretName: {{ .Values.wildcardTlsSecretName }}
          {{- end }}
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.files.resources }}
        resources: {{- toYaml .Values.files.resources | nindent 10 }}
          {{- end }}
        {{- end }}
      releaseName: {{ .Values.files.nameOverride }}
  {{- end }}
  # Dagster
  {{- if .Values.dagster.enabled }}
  - repoURL: {{ .Values.values.repo_URL }}
    targetRevision: {{ .Values.values.branch }}
    path: {{ .Values.dagster.path }}
    helm:
      skipSchemaValidation: true
      valueFiles:
        {{- range .Values.dagster.valueFiles }}
        - $values/Agents/connector/app-values/dagster/{{ . }}
        {{- end }}
      values: |
        dagster:
          dagster-user-deployments:
            deployments:
              - name: field-level-pseudo-anonymisation
                annotations:
                  vault.security.banzaicloud.io/vault-addr: "https://secrets-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}"
                  {{- with include "connector.vaultCaSecret" $ }}
                  vault.security.banzaicloud.io/vault-tls-secret: {{ . }}
                  {{- end }}
                  vault.security.banzaicloud.io/vault-role: {{ .Values.secrets.role }}
                  vault.security.banzaicloud.io/vault-env-image: "ghcr.io/bank-vaults/vault-env:v1.22.1"
                location_name: field_level_pseudo_anonymisation
                enabled: true
                enableSubchart: true
                codeServerArgs:
                  - "--host"
                  - "0.0.0.0"
                  - "--port"
                  - "4000"
                  - "--python-file"
                  - "src/field_level_pseudo_anonymisation/repository.py"
                image:
                  pullPolicy: IfNotPresent
                  repository: ednel-rioja/k8s-images/data-services-field-level-pseudo-anonymisation
                  tag: {{ .Values.dagster.field_level_pseudo_anonymisation.version }}
                port: 4000
                resources:
                  {{- if eq .Values.resourcePreset "low" }}
                  requests:
                    cpu: "0"
                    memory: "0"
                  {{- else }}
                    {{- if .Values.dagster.field_level_pseudo_anonymisation.resources.requests }}
                  requests: {{- toYaml .Values.dagster.field_level_pseudo_anonymisation.resources.requests | nindent 20 }}
                    {{- end }}
                  {{- end }}
                  limits: {{- toYaml .Values.dagster.field_level_pseudo_anonymisation.resources.limits | nindent 20 }}
                livenessProbe:
                  enabled: true
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
                readinessProbe:
                  enabled: true
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              - name: dataframe-level-anonymisation
                annotations:
                  vault.security.banzaicloud.io/vault-addr: "https://secrets-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}"
                  {{- with include "connector.vaultCaSecret" $ }}
                  vault.security.banzaicloud.io/vault-tls-secret: {{ . }}
                  {{- end }}
                  vault.security.banzaicloud.io/vault-role: {{ .Values.secrets.role }}
                  vault.security.banzaicloud.io/vault-env-image: "ghcr.io/bank-vaults/vault-env:v1.22.1"
                location_name: dataframe_level_anonymisation
                enabled: true
                enableSubchart: true
                codeServerArgs:
                  - "--host"
                  - "0.0.0.0"
                  - "--port"
                  - "4000"
                  - "--python-file"
                  - "src/dataframe_level_anonymisation/repository.py"
                image:
                  pullPolicy: IfNotPresent
                  repository: ednel-rioja/k8s-images/data-services-dataframe-level-anonymisation
                  tag: {{ .Values.dagster.dataframe_level_anonymisation.version }}
                port: 4000
                resources:
                  {{- if eq .Values.resourcePreset "low" }}
                  requests:
                    cpu: "0"
                    memory: "0"
                  {{- else }}
                    {{- if .Values.dagster.dataframe_level_anonymisation.resources.requests }}
                  requests: {{- toYaml .Values.dagster.dataframe_level_anonymisation.resources.requests | nindent 20 }}
                    {{- end }}
                  {{- end }}
                  limits: {{- toYaml .Values.dagster.dataframe_level_anonymisation.resources.limits | nindent 20 }}
                livenessProbe:
                  enabled: true
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
                readinessProbe:
                  enabled: true
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
          dagsterDaemon:
            annotations:
              vault.security.banzaicloud.io/vault-addr: "https://secrets-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}"
              {{- with include "connector.vaultCaSecret" $ }}
              vault.security.banzaicloud.io/vault-tls-secret: {{ . }}
              {{- end }}
              vault.security.banzaicloud.io/vault-role: {{ .Values.secrets.role }}
              vault.security.banzaicloud.io/vault-env-image: "ghcr.io/bank-vaults/vault-env:v1.22.1"
          postgresql:
            postgresqlHost: "pg-cluster.{{ .Values.cluster.namespace }}.svc.cluster.local"
            postgresqlUsername: "{{ .Values.cluster.namespace }}_dagster"
            postgresqlPassword: vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.namespace }}-postgres-passwords#{{ .Values.cluster.namespace }}-dagster
            postgresqlDatabase: "{{ .Values.cluster.namespace }}_dagster"
          ingress:
            annotations:
              cert-manager.io/cluster-issuer: {{ .Values.cluster.issuer }}
            dagsterWebserver:
              host: dagster-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}
          dagsterWebserver:
            annotations:
              vault.security.banzaicloud.io/vault-addr: "https://secrets-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}"
              {{- with include "connector.vaultCaSecret" $ }}
              vault.security.banzaicloud.io/vault-tls-secret: {{ . }}
              {{- end }}
              vault.security.banzaicloud.io/vault-role: {{ .Values.secrets.role }}
              vault.security.banzaicloud.io/vault-env-image: "ghcr.io/bank-vaults/vault-env:v1.22.1"
  {{- end }}
  # crossplane # infrastructure-be
  {{- if .Values.crossplane.enabled }}
  # Infrastructure BE
  - repoURL: {{ .Values.values.repo_URL }}
    targetRevision: {{ .Values.values.branch }}
    path: {{ .Values.infrastructure_be.path }}
    helm:
      releaseName: {{ .Values.infrastructure_be.fullnameOverride }}
      valueFiles:
        {{- range .Values.infrastructure_be.valueFiles }}
        - $values/Agents/connector/app-values/infrastructure-be/{{ . }}
        {{- end }}
      values: |
        fullnameOverride: {{ .Values.infrastructure_be.fullnameOverride }}
        backend:
          image:
            registry: ghcr.io/cnie-es
            tag: {{ .Values.imagesTags.infrastructureBe }}
        namespace: {{ .Values.cluster.namespace }}
        backend:
          podAnnotations:
            vault.security.banzaicloud.io/vault-addr: "https://secrets-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}"
            {{- with include "connector.vaultCaSecret" $ }}
            vault.security.banzaicloud.io/vault-tls-secret: {{ . }}
            {{- end }}
            vault.security.banzaicloud.io/vault-role: {{ .Values.secrets.role }}
            vault.security.banzaicloud.io/vault-env-image: "ghcr.io/bank-vaults/vault-env:v1.22.1"
            vault.security.banzaicloud.io/vault-ignore-missing-secrets: "true"
          env:
            ALLOWED_ORIGINS: http://localhost:3001,https://{{ .Values.infrastructure_fe.fullnameOverride }}-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }},https://sd-ui-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}
            VAULT_TOKEN: vault:login
            SPRING_CLOUD_VAULT_TOKEN: vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.namespace }}-infrastructure-be#vault.token
            SPRING_CLOUD_VAULT_URI: "https://secrets-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}"
            SPRING_CLOUD_VAULT_URL: "https://secrets-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}/v1/secret"
            SPRING_DATASOURCE_URL: jdbc:postgresql://pg-cluster.{{ .Values.cluster.namespace }}.svc.cluster.local:5432/{{ .Values.cluster.namespace }}_infrabe
            SPRING_FLYWAY_URL: jdbc:postgresql://pg-cluster.{{ .Values.cluster.namespace }}.svc.cluster.local:5432/{{ .Values.cluster.namespace }}_infrabe
            SPRING_FLYWAY_USER: {{ .Values.cluster.namespace }}_infrabe
            SPRING_FLYWAY_PASSWORD: vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.namespace }}-postgres-passwords#{{ .Values.cluster.namespace }}-infrabe
            SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka.{{ .Values.cluster.commonToolsNamespace }}.svc.cluster.local:9092
            SPRING_CONFIG_IMPORT: "${SPRING_CONFIG_IMPORT_PREFIX}://{{ .Values.secrets.secretEngine }}/{{ .Values.cluster.namespace }}-infrastructure-be"
            SPRING_CONFIG_IMPORT_PREFIX: "vault"
            SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/auth/realms/participant
            GITEA_URL: "http://gitea-http.{{ .Values.cluster.namespace }}.svc.cluster.local:3000/api/v1"
            GITEA_USER: {{ .Values.crossplane.gitea.username }}
            GITEA_PASSWORD: {{ .Values.crossplane.gitea.password }}
            OTEL_EXPORTER_OTLP_ENDPOINT: http://collector-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}
            OTEL_SERVICE_NAME: "infrastructure-be"
            OTEL_LOGS_EXPORTER: "none"
          ingress:
            enabled: true
            hosts:
              - host: {{.Values.infrastructure_be.fullnameOverride }}-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}
                paths:
                - path: /
                  pathType: ImplementationSpecific
            tls:
              - secretName: {{ .Values.infrastructure_be.fullnameOverride }}-tld-secret
                hosts:
                  - {{.Values.infrastructure_be.fullnameOverride }}-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}
            annotations:
              cert-manager.io/cluster-issuer: {{ .Values.cluster.issuer }}
          {{- if eq .Values.resourcePreset "low" }}
          resources:
            requests:
              cpu: "0"
              memory: "0"
          {{- else }}
            {{- if .Values.infrastructure_be.resources }}
          resources: {{- toYaml .Values.infrastructure_be.resources | nindent 12 }}
            {{- end }}
          {{- end }}
  # Infrastructure FE
  - repoURL: {{ .Values.values.repo_URL }}
    targetRevision: {{ .Values.values.branch }}
    path: {{ .Values.infrastructure_fe.path }}
    helm:
      releaseName: {{ .Values.infrastructure_fe.fullnameOverride }}
