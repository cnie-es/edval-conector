          db:
            url: "jdbc:postgresql://pg-cluster.{{ .Values.cluster.namespace }}.svc.cluster.local:5432/{{ .Values.cluster.namespace }}_contract"
            user: {{ .Values.cluster.namespace }}_contract
          kafka:
            bootstrapServer: http://kafka.{{ .Values.cluster.commonToolsNamespace }}.svc.cluster.local:9092
            clientUser: {{ .Values.cluster.namespace }}_contract
            clientPasswords: "vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.commonToolsNamespace }}-kafka-credentials#{{ .Values.cluster.namespace }}_contract"
            topics:
              signContractRequest: sign-contract-req-{{ .Values.cluster.namespace }}
              signContractResponse: sign-contract-resp-{{ .Values.cluster.namespace }}
              statusUpdate: status-update-{{ .Values.cluster.namespace }}
              searchContractRequest: search-contract-req-{{ .Values.cluster.namespace }}
          urls:
            catalogSearch: "https://tls-authority-{{ .Values.namespaceTag.authority }}.{{ include "connector.authorityDomain" . }}/adapter"
            catalogGet: "https://tls-authority-{{ .Values.namespaceTag.authority }}.{{ include "connector.authorityDomain" . }}/fc"
          otel:
            endpoint: http://collector-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}
          vault:
            hashicorp:
              {{- with include "connector.vaultCaSecret" $ }}
              tlsSecret: {{ . }}
              {{- end }}
              service: "https://secrets-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}"
              secretEngine: {{ .Values.secrets.secretEngine }}
              role: {{ .Values.secrets.role }}
              secretConfigPath: "{{ .Values.secrets.secretEngine }}/{{ .Values.cluster.namespace }}-contract"
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.contract.resources }}
        resources: {{- toYaml .Values.contract.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- if .Values.contract_consumer.enabled }}
  # Contract Manager BE (modo CONSUMER) - 2a instancia para el Agente hibrido.
  # DB y credenciales propias (<ns>_contract_consumer); topics separados por modo (-consumer).
  - repoURL: https://github.com/cnie-es/simpl-contract.git
    targetRevision: 2.9.2-edval
    path: charts
    helm:
