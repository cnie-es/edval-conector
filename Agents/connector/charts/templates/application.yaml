        {{- end }}
        podAnnotations:
          vault.security.banzaicloud.io/vault-addr: "https://secrets-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}"
          {{- with include "connector.vaultCaSecret" $ }}
          vault.security.banzaicloud.io/vault-tls-secret: {{ . }}
          {{- end }}
          vault.security.banzaicloud.io/vault-role: {{ .Values.secrets.role }}
          vault.security.banzaicloud.io/vault-env-image: "ghcr.io/bank-vaults/vault-env:v1.22.1"
          # Reinicia este pod cuando rote la password de Redis; ver connector.redisSecretChecksum.
          checksum/redis-secret: {{ include "connector.redisSecretChecksum" $ }}
        image:
          registry: ghcr.io/cnie-es
          tag: {{ .Values.imagesTags.authenticationProvider }}
        appConfig:
          openid-connect:
            certsEndpoint: "https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/auth/realms/participant/protocol/openid-connect/certs"
            certs-endpoint: "https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/auth/realms/participant/protocol/openid-connect/certs"
          management:
            tracing:
              sampling:
                probability: 0.1
            otlp:
              tracing:
                endpoint: http://collector-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}
          spring:
            datasource:
              url: "jdbc:postgresql://pg-cluster.{{ .Values.cluster.namespace }}.svc.cluster.local:5432/{{ .Values.cluster.namespace }}_authenticationprovider"
              username: {{ .Values.namespaceTag.dataprovider }}_authenticationprovider
            data:
              redis:
                host: "redis-master.{{ .Values.cluster.namespace }}.svc.cluster.local"
          microservice:
            identity-provider:
              url: http://identity-provider.{{ .Values.cluster.namespace }}.svc.cluster.local:8080
          client:
            authority:
              url: "https://tls-authority-{{ .Values.namespaceTag.authority }}.{{ include "connector.authorityDomain" . }}"
          simpl:
            certificate:
              san: "tls-participant-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}"
            gateway:
              tier-one-url: "https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}"
              tier-two-url: "https://tls-participant-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}"
        env:
        - name: KAFKA_AUTHPROVIDER
          value: "vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.commonToolsNamespace }}-kafka-credentials#{{ .Values.cluster.namespace }}_authprovider"
        - name: SPRING_DATA_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secrets
              key: redis
        - name: SPRING_DATASOURCE_PASSWORD
          value: "vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.namespace }}-postgres-passwords#{{ .Values.cluster.namespace }}-authenticationprovider"
        kafkaConfig:
          spring:
            kafka:
              bootstrap-servers: kafka.{{ .Values.cluster.commonToolsNamespace }}.svc.cluster.local:9092
              producer:
                properties:
                  security.protocol: SASL_PLAINTEXT
                  sasl.mechanism: PLAIN
                  sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="{{ .Values.cluster.namespace }}_authprovider" password="${KAFKA_AUTHPROVIDER}";
              admin:
                auto-create: true
          simpl:
            kafka:
              topic:
                prefix: iaa.{{ .Values.cluster.namespace }}.
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.auth_provider.resources }}
        resources: {{- toYaml .Values.auth_provider.resources | nindent 10 }}
          {{- end }}
        {{- end }}
