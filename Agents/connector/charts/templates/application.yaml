{{- if eq (.Values.adminRealmAccess | default "public") "internal" }}
  {{- if not .Values.adminHost }}
    {{- fail "adminRealmAccess=internal exige adminHost (host de example.invalid para la consola de Keycloak del participante)" }}
  {{- end }}
  {{- if not .Values.adminIngressTarget }}
    {{- fail "adminRealmAccess=internal exige adminIngressTarget (IP del LB interno de vlan123 para external-dns)" }}
  {{- end }}
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.argocd.appname }}
  namespace: {{ .Values.argocd.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  syncPolicy:
    automated: {}
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
      - ServerSideApply=true
  {{- /*
    Sin ignoreDifferences para signer y simpl-files: sus arreglos ('.' en vez de 'source' y el
    emptyDir de /tmp) estan ahora en sus charts de vendor/, y el estado vivo coincide con git.
  */}}
  project: {{ .Values.project }}
  destination:
    server: {{ .Values.cluster.address }}
    namespace: {{ .Values.cluster.namespace }}
  sources:
  - repoURL: {{ .Values.values.repo_URL }}
    targetRevision: {{ .Values.values.branch }}
    ref: values
  # Redis
  # Sin oci://: con el prefijo, ArgoCD 3.x lo trata como artefacto OCI nativo, ignora `chart` y
  # pide .../bitnamicharts/manifests/<version> (401 de Docker Hub). Asi va por Helm OCI y
  # necesita el repositorio registry-1.docker.io/bitnamicharts dado de alta con enableOCI.
  - repoURL: registry-1.docker.io/bitnamicharts
    targetRevision: 19.6.0
    chart: redis
    helm:
      valueFiles:
        {{- range .Values.redis.valueFiles }}
        - $values/Agents/connector/app-values/Redis/{{ . }}
        {{- end }}
      values: |
        fullnameOverride: {{ .Values.redis.nameOverride }}
        {{- /* El ServiceMonitor que activa app-values/Redis solo si el cluster tiene Prometheus Operator: sin el CRD el sync entero falla. */}}
        {{- if not (and .Values.observability.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1")) }}
        metrics:
          serviceMonitor:
            enabled: false
        {{- end }}
        master:
          podAnnotations:
            vault.security.banzaicloud.io/vault-addr: "https://secrets-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}"
            {{- with include "connector.vaultCaSecret" $ }}
            vault.security.banzaicloud.io/vault-tls-secret: {{ . }}
            {{- end }}
            vault.security.banzaicloud.io/vault-role: {{ .Values.secrets.role }}
            vault.security.banzaicloud.io/vault-env-image: "ghcr.io/bank-vaults/vault-env:v1.22.1"
            # Reinicia este pod cuando rote la password de Redis; ver connector.redisSecretChecksum.
            checksum/redis-secret: {{ include "connector.redisSecretChecksum" $ }}
          {{- if .Values.redis.resourcesPreset }}
          resourcesPreset: {{ .Values.redis.resourcesPreset }}
          {{- end }}
          {{- if eq .Values.resourcePreset "low" }}
          resources:
            requests:
              cpu: "0"
              memory: "0"
          {{- else }}
            {{- if .Values.redis.resources }}
          resources: {{- toYaml .Values.redis.resources | nindent 10 }}
            {{- end }}
          {{- end }}
  {{- if .Values.redis_commander.enabled }}
  # Redis Commander
  - repoURL: {{ .Values.redis_commander.repo_URL }}
    targetRevision: {{ .Values.redis_commander.targetRevision }}
    path: {{ .Values.redis_commander.path }}
    helm:
      valueFiles:
        {{- range .Values.redis_commander.valueFiles }}
        - $values/Agents/connector/app-values/Redis_commander/{{ . }}
        {{- end }}
      values: |
        fullnameOverride: {{ .Values.redis_commander.nameOverride }}
        ingress:
          hosts:
          - host: redis-commander-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}
            paths:
              - "/"
          tls:
          - secretName: redis-commander-tls
            hosts:
              - redis-commander-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}
          annotations:
            cert-manager.io/cluster-issuer: {{ .Values.cluster.issuer }}
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.redis_commander.resources }}
        resources: {{- toYaml .Values.redis_commander.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}
  # Keycloak
  - repoURL: {{ .Values.values.repo_URL }}
    targetRevision: {{ .Values.values.branch }}
    path: {{ .Values.keycloak.path }}
    helm:
      valueFiles:
        {{- range .Values.keycloak.valueFiles }}
        - $values/Agents/connector/app-values/Keycloak/{{ . }}
        {{- end }}
      values: |
        fullnameOverride: {{ .Values.keycloak.nameOverride }}
        # Modo produccion (kc.sh start, no start-dev). KC_HOSTNAME/ADMIN ya fijados mas
        # abajo en extraEnvVars; apisix termina el TLS -> proxyHeaders xforwarded.
        production: true
        proxyHeaders: "xforwarded"
        apiUrl: "https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}"
        podAnnotations:
          vault.security.banzaicloud.io/vault-addr: "https://secrets-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}"
          {{- with include "connector.vaultCaSecret" $ }}
          vault.security.banzaicloud.io/vault-tls-secret: {{ . }}
          {{- end }}
          vault.security.banzaicloud.io/vault-role: {{ .Values.secrets.role }}
          vault.security.banzaicloud.io/vault-env-image: "ghcr.io/bank-vaults/vault-env:v1.22.1"
        auth:
          adminPassword: vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.namespace }}-keycloak#admin
        externalDatabase:
          host: "pg-cluster.{{ .Values.cluster.namespace }}.svc.cluster.local"
          database: {{ .Values.namespaceTag.dataprovider }}_keycloak
          user: {{ .Values.namespaceTag.dataprovider }}_keycloak
          password: vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.namespace }}-postgres-passwords#{{ .Values.cluster.namespace }}-keycloak
        realmHardening:
          enabled: true
          # Default del chart: quay.io/keycloak/keycloak:26.3.2 (oficial, sin curl/bash) ->
          # "curl: command not found" en el Job, bucle infinito. Misma imagen bitnamilegacy que
          # el pod principal (si tiene curl+bash). Visto en vivo en extletest/eks-external-rioja.
          image: "docker.io/bitnamilegacy/keycloak:26.3.2-debian-12-r2"
          keycloakUrl: "http://keycloak.{{ .Values.cluster.namespace }}.svc.cluster.local"
          adminUser: "admin"
          adminPassword: "vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.namespace }}-keycloak#admin"
          realm: "participant"
          vault:
            addr: "https://secrets-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}"
            {{- with include "connector.vaultCaSecret" $ }}
            # Misma CA que el pod de Keycloak: sin ella el hook PostSync muere en vault-env
            # (x509) en cuanto OpenBao se sirve con la CA interna.
            tlsSecret: {{ . }}
            {{- end }}
            role: {{ .Values.secrets.role }}
            envImage: "ghcr.io/bank-vaults/vault-env:v1.22.1"
          {{- if eq (.Values.adminRealmAccess | default "public") "internal" }}
          # adminRealmAccess=internal: el realm master se sirve en el host interno. Sin
          # esto la consola se SIRVE en adminHost pero se AUTENTICA contra el host
          # publico (KC_HOSTNAME), lo que rompe el iframe de 3rd-party-check por CSP e
          # impide cerrar /realms/master/* en internet.
          masterFrontendUrl: "https://{{ .Values.adminHost }}"
          {{- end }}
        {{- if eq (.Values.adminRealmAccess | default "public") "internal" }}
        # Capa 1: cierra /auth/admin/* y /auth/realms/master/* en el host publico del
        # participante. El frontendUrl interno rompe el flujo de NAVEGADOR pero NO el
        # de API: el direct grant contra master seguiria respondiendo desde internet.
        masterRealmPublicBlock:
          enabled: true
          host: "participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}"
        {{- end }}
        {{- if eq (.Values.adminRealmAccess | default "public") "internal" }}
        ingress:
          enabled: true
          ingressClassName: apisix
          hostname: {{ .Values.adminHost | quote }}
          {{- /* Keycloak sirve en la RAIZ: /realms/master responde 200 y
                 /auth/realms/master da 404. El prefijo /auth del host publico NO es de
                 Keycloak, lo pone el tier1-gateway. Este Ingress va DIRECTO al Service
                 de Keycloak, asi que va en la raiz y sin reescritura. */}}
          path: /
          pathType: Prefix
          annotations:
            k8s.apisix.apache.org/allowlist-source-range: {{ .Values.adminAllowlistSourceRange | default "10.123.0.1/32" | quote }}
            external-dns.alpha.kubernetes.io/target: {{ .Values.adminIngressTarget | quote }}
          extraTls:
            - hosts:
                - {{ .Values.adminHost | quote }}
              secretName: private-ca-tls
        {{- end }}
        extraEnvVars:
        - name: KC_HOSTNAME_ADMIN
        {{- if eq (.Values.adminRealmAccess | default "public") "internal" }}
          {{- /* La consola sale por el host interno; KC_HOSTNAME (abajo) NO se toca, asi
                 que los usuarios del realm del participante siguen entrando por el
                 publico. Funciona porque KC_HOSTNAME_STRICT ya esta en false.
                 OJO: con ingress.enabled el ConfigMap del subchart tambien emite
                 KC_HOSTNAME (=adminHost), pero `env` gana a `envFrom`, asi que manda
                 este extraEnvVars. Verificado en prodauth. */}}
          value: "https://{{ .Values.adminHost }}"
        {{- else }}
          value: "https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/auth"
        {{- end }}
        - name: KC_HOSTNAME
          value: "https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/auth"
        - name: USERS_ROLES_BASE_URL
          value: "http://users-roles.{{ .Values.cluster.namespace }}.svc.cluster.local:8080"
        - name: KEYCLOAK_BASE_URL
          value: "https://participant-be-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/auth"
        - name: AUTHENTICATION_PROVIDER_BASE_URL
          value: "http://authentication-provider.{{ .Values.cluster.namespace }}.svc.cluster.local:8080"
        - name: REALM
          value: "participant"
        - name: KEYCLOAK_EXTRA_ARGS
          value: --import-realm
        # production=true (kc start optimizado) exige HTTPS o http-enabled. apisix/tier1
        # terminan el TLS y hablan HTTP con Keycloak (proxyHeaders=xforwarded).
        - name: KC_HTTP_ENABLED
          value: "true"
        # RAIZ del sitio publico que sirve los logos de los correos de Keycloak, igual
        # que en el Keycloak de la authority. El theme lee
        # ednelAssetBaseUrl=${env.EDNEL_EMAIL_ASSET_BASE_URL:} de su theme.properties y
        # Keycloak sustituye la referencia al cargarlo. NO lleva ruta: el theme cuelga de
        # esta raiz sus dos rutas, themes/custom/ednel y sites/default/files/<yyyy-mm>.
        #
        # Es el portal de PRODUCCION en todos los entornos a proposito: es el unico sitio
        # donde esas imagenes estan publicadas, y sobre todo porque el correo no lo abre
        # el navegador del destinatario -- en Gmail lo descarga la CDN de Google desde
        # Internet, asi que un host .example.invalid no carga ni para quien lea el correo
        # desde la VPN.
        #
        # Sin la variable el theme cae a ${url.resourcesUrl}, cuyo tag de version rota en
        # cada arranque del pod porque el initContainer rebaja el jar, y deja los logos
        # rotos en los correos YA entregados.
        #
        # Faltaba: el realm del participante ya trae emailTheme y el jar del theme ya
        # incluye las plantillas de correo (executeActions.ftl y los mensajes en es, ca,
        # va, eu y gl), asi que esto era lo unico que separaba a sus correos de los de la
        # authority. Comprobado en caliente sobre stageaytopruebautom.
        - name: EDNEL_EMAIL_ASSET_BASE_URL
          value: "https://vallelengua.es"
        # El entrypoint de la imagen Bitnami hace su PROPIA comprobacion de arranque con
        # KEYCLOAK_DATABASE_* (convencion legacy propia de Bitnami), separada de KC_DB_URL
        # (que SI genera bien el ConfigMap del chart a partir de externalDatabase.host).
        # Sin esto, KEYCLOAK_DATABASE_HOST cae al default hardcodeado del script
        # ("postgresql") y el pod se queda reintentando "cannot resolve host postgresql"
        # para siempre, aunque KC_DB_URL apunte bien a pg-cluster. Visto en vivo en
        # extletest/eks-external-rioja (libkeycloak.sh:299-306, keycloak_initialize()).
        # Sin KEYCLOAK_DATABASE_VENDOR: el entrypoint lo pasa tal cual a KC_DB y Keycloak 26 solo
        # acepta "postgres" ("Invalid value for option 'KC_DB': postgresql"). El vendor ya sale de
        # KC_DB_URL.
        - name: KEYCLOAK_DATABASE_HOST
          value: "pg-cluster.{{ .Values.cluster.namespace }}.svc.cluster.local"
        - name: KEYCLOAK_DATABASE_PORT
          value: "5432"
        - name: KEYCLOAK_DATABASE_NAME
          value: "{{ .Values.namespaceTag.dataprovider }}_keycloak"
        - name: KEYCLOAK_DATABASE_USER
          value: "{{ .Values.namespaceTag.dataprovider }}_keycloak"
        - name: KEYCLOAK_DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              # Mismo Secret/clave que usa KC_DB_PASSWORD (lo crea este mismo chart a partir
              # de externalDatabase.password, nombre fijo "<fullnameOverride>-externaldb").
              name: keycloak-externaldb
              key: db-password
        initContainers:
        - name: download-realm
          image: docker.io/curlimages/curl:8.18.0
          command: ["/bin/sh", "-c"]
          env:
            {{- with .Values.configFiles.tokenRef }}
            - name: CONFIG_FILES_TOKEN
              value: {{ . | quote }}
            {{- end }}
          args:
            - |
              curl -fsSL \
                {{ if .Values.configFiles.insecureTls }}-k {{ end }}{{ if .Values.configFiles.tokenRef }}-H "Authorization: token ${CONFIG_FILES_TOKEN}" {{ end }}\
                "{{ required "configFiles.baseUrl es obligatorio: de ahi se descargan el export del realm y el tema de Keycloak" .Values.configFiles.baseUrl }}/{{ .Values.configFiles.realmExportPath }}" \
                -o /realm-template/realm-template.json
          volumeMounts:
            - name: realm-config-volume
              mountPath: /realm-template
        - name: import-realm
          image: docker.io/library/nginx:1.27-alpine
          command: ["/bin/sh", "-c"]
          env:
            - name: REDIRECT_URIS
              value: |-
                [ "https://participant-fe-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/*","https://catalogue-ui-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/*","https://sd-ui-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/*","https://infrastructure-fe-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/*","https://data-dashboard-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/*" ]
            - name: REALM_NAME
              value: realm
            # SMTP del realm del participante. Sale del Secret notification-smtp, el MISMO
            # que usan notification-service y el realm de la authority: no se crean
            # credenciales nuevas. Hace falta para que Keycloak pueda mandarle al admin el
            # correo de UPDATE_PASSWORD; hasta ahora el realm tenia smtpServer vacio y su
            # Keycloak no podia enviar nada.
            # El Secret lo replica common-sealed-secrets al namespace del participante
            # (scope 'hybrids'), ver edval-gitops#169 — SOLO para el core interno.
            #
            # Un participante EXTERNO (embeddedCommon.enabled=true) no tiene ese Secret ni
            # forma de que se lo repliquen (no hay common-sealed-secrets fuera del core, y
            # muchos externos ni siquiera tienen sealed-secrets controller). Sin este if, el
            # initContainer import-realm se queda en CreateContainerConfigError para
            # siempre: "secret notification-smtp not found" (visto en vivo en
            # extletest/eks-external-rioja). Para externos se vuelve al comportamiento
            # previo a edval-gitops#169: smtpServer vacio, Keycloak no manda ese correo pero
            # arranca.
            {{- if .Values.embeddedCommon.enabled }}
            - name: SMTP_HOST
              value: ""
            - name: SMTP_PORT
              value: ""
            - name: SMTP_STARTTLS
              value: ""
            - name: SMTP_USERNAME
              value: ""
            - name: SMTP_PASSWORD
              value: ""
            {{- else }}
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: notification-smtp
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: notification-smtp
                  key: SMTP_PORT
            - name: SMTP_STARTTLS
              valueFrom:
                secretKeyRef:
                  name: notification-smtp
                  key: SMTP_STARTTLS
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: notification-smtp
                  key: SMTP_USERNAME
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notification-smtp
                  key: SMTP_PASSWORD
            {{- end }}
            - name: ADMIN_DATAPROVIDER_FIRSTNAME
              value: {{ .Values.keycloak.adminUser.firstName | quote }}
            - name: ADMIN_DATAPROVIDER_LASTNAME
              value: {{ .Values.keycloak.adminUser.lastName | quote }}
            - name: ADMIN_DATAPROVIDER_EMAIL
              value: {{ .Values.keycloak.adminUser.email | quote }}
          args:
            - |
              envsubst '$REDIRECT_URIS $ADMIN_DATAPROVIDER_FIRSTNAME $ADMIN_DATAPROVIDER_LASTNAME $ADMIN_DATAPROVIDER_EMAIL $SMTP_HOST $SMTP_PORT $SMTP_STARTTLS $SMTP_USERNAME $SMTP_PASSWORD' \
                < /realm-template/realm-template.json > /config/${REALM_NAME}.json;
          volumeMounts:
            - name: realm-config-volume
              mountPath: /realm-template
            - name: realm-volume
              mountPath: /config
        - name: init-spi
          image: docker.io/curlimages/curl:8.18.0
          command: ["/bin/sh", "-c"]
          env:
            {{- with .Values.configFiles.tokenRef }}
            - name: CONFIG_FILES_TOKEN
              value: {{ . | quote }}
            {{- end }}
          args:
            - |
              curl -fsSL \
                {{ if .Values.configFiles.insecureTls }}-k {{ end }}{{ if .Values.configFiles.tokenRef }}-H "Authorization: token ${CONFIG_FILES_TOKEN}" {{ end }}\
                "{{ required "configFiles.baseUrl es obligatorio: de ahi se descarga el jar del authenticator SPI" .Values.configFiles.baseUrl }}/{{ .Values.configFiles.authenticatorPath }}" \
                -o /custom-spi/keycloak-authenticator.jar
          volumeMounts:
          - name: spi-volume
            mountPath: /custom-spi
        - name: init-theme
          image: docker.io/curlimages/curl:8.18.0
          command: ["/bin/sh", "-c"]
          env:
            {{- with .Values.configFiles.tokenRef }}
            - name: CONFIG_FILES_TOKEN
              value: {{ . | quote }}
            {{- end }}
          args:
            - |
              curl -fsSL \
                {{ if .Values.configFiles.insecureTls }}-k {{ end }}{{ if .Values.configFiles.tokenRef }}-H "Authorization: token ${CONFIG_FILES_TOKEN}" {{ end }}\
                "{{ required "configFiles.baseUrl es obligatorio: de ahi se descargan el export del realm y el tema de Keycloak" .Values.configFiles.baseUrl }}/{{ .Values.configFiles.themePath }}" \
                -o /custom-theme/keycloakify-starter.jar
          volumeMounts:
          - name: theme-volume
            mountPath: /custom-theme
        {{- if .Values.keycloak.resourcesPreset }}
        resourcesPreset: {{ .Values.keycloak.resourcesPreset }}
        {{- end }}
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.keycloak.resources }}
        resources: {{- toYaml .Values.keycloak.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- if .Values.sdtooling_api_be.enabled }}
  # SD Tooling API BE
  - repoURL: https://github.com/cnie-es/simpl-sdtooling-api-be.git
    targetRevision: 1.25.0-edval
    path: charts
    helm:
      valueFiles:
        {{- range .Values.sdtooling_api_be.valueFiles }}
        - $values/Agents/connector/app-values/sdtooling-api-be/{{ . }}
        {{- end }}
      values: |
        ingress:
          clusterIssuer: {{ .Values.cluster.issuer }}
        domain: {{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}
        image:
          repository: "ghcr.io/ednel-rioja/k8s-images/sdtooling-api-be"
          tag: {{ .Values.imagesTags.sdtoolingApiBe }}
        catalogueAdapter:
          tier2Gateway:
            url: "https://tls-authority-{{ .Values.namespaceTag.authority }}.{{ include "connector.authorityDomain" . }}"
        federatedCatalogue:
          tier2Gateway:
            url: "https://tls-authority-{{ .Values.namespaceTag.authority }}.{{ include "connector.authorityDomain" . }}"
        openapiConfig:
          servers: https://sd-creation-wizard-api
        openTelemetry:
          otlpExporter:
            endpoint: http://collector-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}
        hash:
          config:
            algorithm: "SHA256"
            templates: '[
                          {
                            "key": "Contract Template 1",
                            "value": "https://files-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/static/contract/ContractTemplate1.json"
                          },
                          {
                            "key": "Contract Template 2",
                            "value": "https://files-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/static/contract/ContractTemplate2.json"
                          },
                          {
                            "key": "Contract Template 3",
                            "value": "https://files-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/static/contract/ContractTemplate3.json"
                          },
                          {
                            "key": "Billing Schema 1",
                            "value": "https://files-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/static/pdf/BillingSchema1.pdf"
                          },
                          {
                            "key": "Billing Schema 2",
                            "value": "https://files-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/static/pdf/BillingSchema2.pdf"
                          },
                          {
                            "key": "Billing Schema 3",
                            "value": "https://files-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/static/pdf/BillingSchema1.pdf"
                          },
                          {
                            "key": "Sla Agreements 1",
                            "value": "https://files-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/static/pdf/SLAAgreement1.pdf"
                          },
                          {
                            "key": "Sla Agreements 2",
                            "value": "https://files-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/static/pdf/SLAAgreement2.pdf"
                          },
                          {
                            "key": "Sla Agreements 3",
                            "value": "https://files-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/static/pdf/SLAAgreement1.pdf"
                          }
                        ]'
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.sdtooling_api_be.resources }}
        resources: {{- toYaml .Values.sdtooling_api_be.resources | nindent 10 }}
          {{- end }}
        {{- end }}
      releaseName: {{ .Values.sdtooling_api_be.nameOverride }}
  {{- end }}
  {{- if .Values.sdtooling_validation_api_be.enabled }}
  # SD Tooling Validation API BE
  - repoURL: https://code.europa.eu/api/v4/projects/868/packages/helm/stable
    targetRevision: 1.21.0
    chart: sd-creation-wizard
    helm:
      values: |
        image:
          registry: ghcr.io/cnie-es
          tag: {{ .Values.imagesTags.sdtoolingValidationApiBe }}
        openTelemetry:
          otlpExporter:
            endpoint: http://collector-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}
