  - repoURL: https://github.com/cnie-es/edc-data-dashboard.git
    targetRevision: v1.1.1-edval
    path: charts
    helm:
      valueFiles:
        {{- range .Values.data_dashboard.valueFiles }}
        - $values/Agents/connector/app-values/data-dashboard/{{ . }}
        {{- end }}
      values: |
        fullnameOverride: {{ .Values.data_dashboard.nameOverride }}
        image:
          repository: "ghcr.io/cnie-es/datadashboard"
          tag: {{ .Values.imagesTags.dataDashboard }}
        ingress:
          enabled: true
          className: apisix
          annotations:
            kubernetes.io/ingress.class: apisix
            {{- if (.Values.tls).perHost }}
            cert-manager.io/cluster-issuer: {{ .Values.cluster.issuer }}
            {{- end }}
            k8s.apisix.apache.org/proxy-body-size: "5m"
            k8s.apisix.apache.org/proxy-buffer-size: "8k"
            k8s.apisix.apache.org/proxy-buffering: "on"
          hosts:
            - host: data-dashboard-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}
              paths:
                - path: /
                  pathType: Prefix
