  {{- if .Values.simpl_edc_consumer.enabled }}
  # Simpl EDC (perfil consumer) - 2a instancia para el Agente hibrido.
  # Service simpl-edc-consumer-service (29xxx); DB propia <ns>_edc_consumer; mismo participante.
  - repoURL: https://github.com/cnie-es/simpl-edc.git
    targetRevision: 1.0.23-edval
    path: charts
    helm:
      releaseName: {{ .Values.simpl_edc_consumer.nameOverride }}
      valueFiles:
        {{- range .Values.simpl_edc_consumer.valueFiles }}
        - $values/Agents/connector/app-values/simpl-edc-consumer/{{ . }}
        {{- end }}
      values: |
        deployment:
          image: {{ .Values.images.simplEdc }}
          tag: {{ .Values.imagesTags.simplEdc }}
          host: {{ .Values.simpl_edc_consumer.nameOverride }}-service
          callbackAddress: "https://tls-participant-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/edc"
        env:
          datasourceurl: "jdbc:postgresql://pg-cluster.{{ .Values.cluster.namespace }}.svc.cluster.local:5432/{{ .Values.cluster.namespace }}_edc_consumer"
          edcParticipantId: {{ .Values.cluster.namespace }}
        postgresql:
          username: {{ .Values.cluster.namespace }}_edc_consumer
        # El chart cnie-es/simpl-edc comprueba tls.url.participantIdSource pero el curl de su init
        # wait-for-participant-id usa tls.participantIdSource: sin esta clave el init llama a curl sin
        # URL ("no URL specified") y el EDC no arranca nunca.
        tls:
          participantIdSource: http://authentication-provider:8080/v1/credentials
        hashicorp:
          {{- with include "connector.vaultCaSecret" $ }}
          tlsSecret: {{ . }}
          {{- end }}
          role: {{ .Values.secrets.role }}
          service: "https://secrets-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}"
        secretEngine: {{ .Values.secrets.secretEngine }}
        ingress:
          corsAllowOrigin: "*"
          # publicEndpoint deshabilitado: la instancia provider ya expone public-be-<ns>;
          # habilitar aqui colisionaria en el mismo host/ingress.
          publicEndpoint:
            enabled: false
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.simpl_edc_consumer.resources }}
        resources: {{- toYaml .Values.simpl_edc_consumer.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}
  {{- if .Values.edc_connector_adapter.enabled }}
  # EDC Connector Adapter
  - repoURL: https://github.com/cnie-es/simpl-edc-connector-adapter.git
    targetRevision: 1.14.1-edval
    path: charts
    helm:
      releaseName: {{ .Values.edc_connector_adapter.nameOverride }}
      valueFiles:
        {{- range .Values.edc_connector_adapter.valueFiles }}
        - $values/Agents/connector/app-values/edc-connector-adapter/{{ . }}
        {{- end }}
      values: |
        image:
          repository: "ghcr.io/cnie-es/data1-edcconnectoradapter"
          tag: {{ .Values.imagesTags.edcConnectorAdapter | quote }}
        domain: {{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}
        ingress:
          clusterIssuer: {{ .Values.cluster.issuer }}
        openapiConfig:
          servers: https://edc-connector-adapter-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}
        openTelemetry:
          otlpExporter:
            endpoint: http://collector-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}
        edcConnector:
          tier2BaseUrl: https://tls-participant-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/edc
          participantId: {{ .Values.cluster.namespace }}
          # Con participantIdSource, un init container resuelve el participantId canonico (UUID)
          # desde el authentication-provider y lo exporta como EDC_CONNECTOR_PARTICIPANT_ID,
          # ignorando participantId (= namespace). Debe coincidir con edc.participant.id del
          # conector simpl-edc para que el assigner de la policy case en la contratacion.
          participantIdSource: "http://authentication-provider:8080/v1/credentials"
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.edc_connector_adapter.resources }}
        resources: {{- toYaml .Values.edc_connector_adapter.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}
  {{- if .Values.edc_connector_adapter_consumer.enabled }}
  # EDC Connector Adapter (perfil consumer) - 2a instancia para el Agente hibrido.
  # Publica los topics contract_consumption.* que consume contract-consumption-be.
  - repoURL: https://github.com/cnie-es/simpl-edc-connector-adapter.git
    targetRevision: 1.14.1-edval
    path: charts
    targetRevision: {{ .Values.chartRevisions.edcConnectorAdapter }}
    helm:
      releaseName: {{ .Values.edc_connector_adapter_consumer.nameOverride }}
      valueFiles:
        {{- range .Values.edc_connector_adapter_consumer.valueFiles }}
        - $values/Agents/connector/app-values/edc-connector-adapter-consumer/{{ . }}
        {{- end }}
      values: |
        image:
          repository: "ghcr.io/cnie-es/data1-edcconnectoradapter"
          tag: {{ .Values.imagesTags.edcConnectorAdapter | quote }}
        ingress:
          clusterIssuer: {{ .Values.cluster.issuer }}
        domain: {{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}
        openapiConfig:
          servers: https://edc-connector-adapter-consumer-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}
        openTelemetry:
          otlpExporter:
            endpoint: http://collector-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}

        profile: consumer
        appJarPath: "/home/simpluser/app.jar"
        # Identidad del participante (id + organization) con la que se etiquetan los registros de
        # transferencias y contratos del clearing house. Sin ella el adapter no pone ningun nombre
        # (consumerName/providerName). El authentication-provider vive en el propio namespace.
        participant:
          authApi:
            baseUrl: "http://authentication-provider.{{ .Values.cluster.namespace }}.svc.cluster.local:8080"

        edcConnector:
          # apiKey real viene de OpenBao via /vault/secrets/config.txt (source en el command).
          # Aqui un placeholder para no disparar el mutating webhook de bank-vaults.
          # Apunta al conector HIBRIDO unico (management :19193); antes, instancia consumer 29xxx.
          baseUrl: http://simpl-edc-service:19193
          apiKey: "placeholder-overridden-by-vault-agent"
          participantId: {{ .Values.cluster.namespace }}
          tier2BaseUrl: https://tls-participant-{{ .Values.namespaceTag.dataprovider }}.{{ .Values.domainSuffix }}/edc
          # Con participantIdSource, un init container resuelve el participantId canonico (UUID)
          # desde el authentication-provider y lo exporta como EDC_CONNECTOR_PARTICIPANT_ID.
          # Debe coincidir con edc.participant.id del conector simpl-edc para que el assigner
          # de la policy case en la contratacion.
          participantIdSource: "http://authentication-provider:8080/v1/credentials"

        kafka:
          bootstrapServers: kafka.{{ .Values.cluster.commonToolsNamespace }}.svc.cluster.local:9092
          consumer:
            groupId: contract_consumption
          topics:
            transferStatus: contract_consumption.transfer_status-{{ .Values.cluster.namespace }}
            transferDeprovisioning: contract_consumption.transfer_deprovisioning-{{ .Values.cluster.namespace }}
            transferRecord: contract_consumption.transfer_record-{{ .Values.cluster.namespace }}
            contractRecord: contract_consumption.contract_record-{{ .Values.cluster.namespace }}
          auth:
            type: SASL_PLAINTEXT
          fatalIfBrokerNotAvailable: false

        cluster:
          namespace: {{ .Values.cluster.namespace }}

        vault:
          secretEngine: {{ .Values.secrets.secretEngine }}
          secretPath: "{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.namespace }}-edc-connector-adapter-consumer"
          role: {{ .Values.secrets.role }}
          service: "https://secrets-{{ .Values.namespaceTag.common }}.{{ include "connector.internalDomain" $ }}"
        {{- with include "connector.vaultCaSecret" $ }}
          tlsSecret: {{ . }}
        {{- end }}
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.edc_connector_adapter_consumer.resources }}
        resources: {{- toYaml .Values.edc_connector_adapter_consumer.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}
  {{- if .Values.monitoring.enabled }}
  # Monitoring
  - repoURL: https://code.europa.eu/api/v4/projects/828/packages/helm/stable
    targetRevision: 0.10.0
    chart: eck-monitoring
    helm:
      releaseName: {{ .Values.monitoring.fullnameOverride }}
      valueFiles:
        {{- range .Values.monitoring.valueFiles }}
        - $values/Agents/connector/app-values/monitoring/{{ . }}
        {{- end }}
      values: |
        clusterIssuer: {{ .Values.cluster.issuer }}
        domainSuffix: {{ .Values.domainSuffix }}
        creimage:
          tag: {{ .Values.imagesTags.monitoring }}
        namespaceTag: {{ .Values.namespaceTag.dataprovider }}
        # mainNamespace must be the common namespace where the elastic stack
        # lives (filebeat/metricbeat ship there). The eck-monitoring chart
        # gates `logstash_mon.yaml` with `if eq namespaceTag mainNamespace`,
        # so they must be DIFFERENT in participant deployments — otherwise
        # the chart tries to render the central logstash monitor pod here
        # and explodes on `nil pointer .Values.logstash.mon.pipelines`
        # (that subtree only exists in the common-side values, not in the
        # participant override). cluster.commonToolsNamespace is set by the
        # participant-apps chart to the common namespace (e.g. "intcommon").
        mainNamespace: {{ .Values.namespaceTag.common | default .Values.cluster.commonToolsNamespace }}
        filebeat:
          {{- if eq .Values.resourcePreset "low" }}
          resources:
            requests:
              cpu: "0"
              memory: "0"
          {{- else }}
            {{- if .Values.monitoring.resources.filebeat }}
          resources: {{- toYaml .Values.monitoring.resources.filebeat | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if .Values.nodeSelector }}
          nodeSelector: {{- toYaml .Values.nodeSelector | nindent 12 }}
          {{- end }}
          {{- if .Values.nodeSelector }}
        metricbeat:
          nodeSelector: {{- toYaml .Values.nodeSelector | nindent 12 }}
          {{- end }}
  {{- end }}
  # Contract
  - repoURL: https://github.com/cnie-es/simpl-contract.git
    targetRevision: 2.9.2-edval
    path: charts
    helm:
