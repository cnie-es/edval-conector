---
values:
  repo_URL: https://github.com/cnie-es/edval-conector.git
  branch: v3.1.8-test.11
project: "${PROJECT}"
domainSuffix: "${DOMAINSUFFIX}"
internalDomainSuffix: ''
projectStage: ''
authorityDomainSuffix: ''
namespaceTag:
  dataprovider: "${NAMESPACETAG}"
  authority: "${AUTHNAMESPACETAG}"
  common: "${COMMONSPACETAG}"
resourcePreset: default
imagesTags:
  authenticationProvider: 2.10.1
  feAuthenticationProvider: 138a338a464378dbfe0753a532c59d36be4cd671
  tier1Gateway: 2.11.0
  tier2Gateway: 2.10.0
  tier2Proxy: 1.5.1
  usersRoles: 2.11.1
  usersRolesFe: 31c0794f07bcbe19d7988829ba93ece21938d597
  sdtoolingApiBe: 1.25.0-edval-v2
  sdtoolingValidationApiBe: 1.20.0
  # Igual que el chart publico simpl-files 1.4.0 (appVersion 1.4.0). Con la imagen 1.2.0 y el
  # securityContext de ese chart (runAsUser 101) nginx no puede escribir /tmp/nginx.pid.
  simplFiles: 1.4.0
  xfscAdvsearch: 1.22.0
  contractConsumptionBe: 1.20.0
  edcConnectorAdapter: '1.15.0'
  sdUi: 1.8.0-edval
  signer: 0.0.1
  simplCatalogueClient: 2.3.2
  simplEdc: 1.0.21
  infrastructureBe: 1.3.4
  infrastructureFe: 1.2.1
  monitoring: 0.5.4
  dataDashboard: v1.0.4-edval
  contract: 2.9.0
  stubs: 2.1.0
argocd:
  appname: "${NAMESPACE}"
  namespace: "${ARGOCDNAMESPACE}"
cluster:
  address: https://kubernetes.default.svc
  namespace: "${NAMESPACE}"
  commonToolsNamespace: "${COMMONNAMESPACE}"
  issuer: "${CLUSTERISSUER}"
  internalIssuer: "${CLUSTERINTERNALISSUER}"
secrets:
  secretEngine: "${SECRETENGINE}"
  role: "${SECRETROLE}"
  tlsSecret: ''
  caBundle: ''
embeddedCommon:
  enabled: false
wildcardTlsExternal: false
# TLS per-host con cert-manager (p. ej. Let's Encrypt via cluster.issuer) en los ingress que por
# defecto esperan un wildcard: OpenBao embebido, catalogue-ui, sd-ui y data-dashboard. Con true,
# cada uno pide su certificado <host>-tls con la anotacion cert-manager.io/cluster-issuer.
# Requiere que wildcardTlsSecretName este vacio. Con false (defecto) no cambia nada.
tls:
  perHost: false
lbNetwork: public
# Confianza en una CA privada para los servicios Java que hablan con la authority (tier1-gateway,
# tier2-gateway, authentication-provider-be). Caso tipico: authority on-prem con *.cnie.internal
# firmado por la CNIE Internal CA. caBundle es el PEM de la CA (y sus intermedias); es publico.
# Ver templates/ca-truststore.yaml.
caTrust:
  enabled: false
  caBundle: ''
  # Imagenes del Job que construye el truststore: una JRE (keytool + cacerts) y kubectl.
  jreImage: docker.io/library/eclipse-temurin:21-jre
  kubectlImage: docker.io/alpine/kubectl:1.35.2
agentList:
  authorities: []
  consumers: []
  providers: []
openbao:
  repo_URL: https://github.com/openbao/openbao-helm.git
  targetRevision: openbao-0.19.1
  path: charts/openbao
  valueFiles:
  - values.yaml
  resources:
    requests:
      cpu: '0'
      memory: '0'
openbao_init:
  path: vendor/openbao-init/charts
  repo_URL: https://github.com/cnie-es/edval-conector.git
  targetRevision: v3.1.8-test.11
  chart_name: openbao-init
vault_webhook:
  repo_URL: https://github.com/bank-vaults/vault-secrets-webhook.git
  # Fijado: con main el chart trae la imagen :latest, que desde v1.23 rechaza mutar pods cuya
  # anotacion vault-addr no este en VAULT_ADDR_ALLOWLIST ("not in the configured allowlist"), y
  # entonces ningun pod recibe vault-env y todos los vault:... llegan literales. v1.22.2 es la
  # version que corre on-prem.
  targetRevision: v1.22.2
  webhookImageTag: v1.22.2
  path: deploy/charts/vault-secrets-webhook
  image:
    registry: docker.io
    repository: openbao/openbao
    tag: 2.5.0
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 512Mi
confluent_operator:
  chart: confluent-for-kubernetes
  repo_URL: https://packages.confluent.io/helm
  targetRevision: 0.1351.59
  nameOverride: confluent-operator
  image:
    registry: docker.io
    application: confluentinc/confluent-operator
    tag: 0.1351.59
kafka:
