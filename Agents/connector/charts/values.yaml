  repo_URL: https://github.com/cnie-es/edval-conector.git
  path: vendor/kafka/charts
  targetRevision: v3.1.8-test.11
  chart_name: kafka
  image:
    registry: docker.io
    application: confluentinc/cp-server
    tag: 8.1.1
    initImage: confluentinc/confluent-init-container
    initTag: 3.1.1
  auth:
    enabled: true
    secretMethod: vault
  topic:
    autocreate: false
  listeners:
    tls:
      port: 9094
  resources:
    kafka:
      requests:
        cpu: 400m
        memory: 400Mi
      limits:
        cpu: 2
        memory: 4Gi
    kraftController:
      requests:
        cpu: 400m
        memory: 400Mi
      limits:
        cpu: 2
        memory: 4Gi
  valueFiles:
  - values.yaml
